<title>Relic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
/* Layout: a pixel-art world map at night fills the screen. The relic hangs top-left as an exhibit card.
   Where = tap the map (slim bar at the bottom). Solving it zooms to the country and slides up the When/What panel. */
:root {
  color-scheme: dark;
  --space: #070e22;
  --panel: #0e1a39;
  --panel-2: #15244b;
  --line: #2a3b6a;
  --line-2: #3d5491;
  --frame: #5fb4c9;
  --cyan: #8fe3f0;
  --pink: #ff8fb8;
  --ink: #f3ecdc;
  --ink-soft: #a9b4d3;
  --ink-faint: #6878a6;
  --dark-ink: #141a2e;
  --butter: #f6d36b;
  --mint: #7fe0a6;
  --peach: #f7a46b;
  --coral: #ef6b6b;
  --lavender: #8f9cf0;
  --drop: 4px 4px 0 #030816;
  --font-display: "Pixelify Sans", ui-monospace, monospace;
  --font-label: "Silkscreen", ui-monospace, monospace;
  --font-ui: "VT323", ui-monospace, "SF Mono", Menlo, monospace;
  --font-num: "VT323", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--space); color: var(--ink); font-family: var(--font-ui); font-size: 20px; line-height: 1.15; overflow: hidden; -webkit-font-smoothing: none; }
button, input { font: inherit; color: inherit; }
*:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
b { font-weight: 400; color: var(--butter); }

#app { position: fixed; inset: 0; }

/* ---------- Map ---------- */
#map { position: absolute; left: 0; top: 0; display: block; cursor: grab; touch-action: none; image-rendering: crisp-edges; image-rendering: pixelated; }
#map.dragging { cursor: grabbing; }
#map.over { cursor: pointer; }
.fx { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,.13) 0 1px, transparent 1px 3px), radial-gradient(ellipse at center, transparent 58%, rgba(2,5,15,.6) 100%); }
.tw { position: absolute; width: 3px; height: 3px; background: var(--cyan); opacity: 0; animation: tw 5s steps(5) infinite; }
@keyframes tw { 50% { opacity: .55; } }
#mlabels { position: absolute; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.mlabel { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 5px; white-space: nowrap; font-family: var(--font-label); font-size: 10px; letter-spacing: .04em; text-transform: uppercase; background: var(--panel); color: var(--ink); border: 2px solid var(--line-2); padding: 1px 5px 2px; box-shadow: 2px 2px 0 #030816; }
.mlabel i { width: 7px; height: 7px; flex: none; }
.mlabel b { color: var(--ink-soft); }
.mlabel.win { border-color: var(--mint); }
.tip { position: absolute; z-index: 3; pointer-events: none; font-family: var(--font-label); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; background: var(--dark-ink); color: var(--ink); border: 2px solid var(--frame); padding: 2px 6px; white-space: nowrap; }

/* ---------- Boxes + buttons ---------- */
.box { background: var(--panel); border: 2px solid var(--frame); box-shadow: var(--drop); }
.btn { height: 42px; border: 2px solid var(--line-2); background: var(--panel-2); padding: 0 14px; font-family: var(--font-label); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; white-space: nowrap; transition: transform .12s, opacity .2s; }
.btn:active { transform: translate(2px, 2px); }
.btn-primary { background: var(--butter); color: var(--dark-ink); border-color: var(--dark-ink); box-shadow: inset -3px -3px 0 rgba(0,0,0,.18), 3px 3px 0 #030816; }
.btn-primary:active { box-shadow: inset -3px -3px 0 rgba(0,0,0,.18), 1px 1px 0 #030816; }
.btn-primary:disabled { opacity: .35; cursor: not-allowed; transform: none; }
.btn .cost { opacity: .7; margin-left: 8px; }
.btn-ghost { color: var(--ink); }
.pulse { animation: pulse 1.4s steps(2) infinite; }
@keyframes pulse { 50% { box-shadow: inset -3px -3px 0 rgba(0,0,0,.18), 3px 3px 0 #030816, 0 0 0 3px var(--cyan); } }

/* ---------- Top bar ---------- */
.topbar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 5;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.brand { display: flex; align-items: baseline; gap: 14px; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 34px; letter-spacing: .08em; color: var(--ink); text-shadow: -2px 0 var(--pink), 2px 0 var(--cyan), 0 4px 0 #030816; }
.brand .issue { font-family: var(--font-label); font-size: 11px; color: var(--cyan); letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
.right-tools { display: flex; align-items: center; gap: 10px; }
.insight { position: relative; display: flex; align-items: center; gap: 9px; padding: 5px 12px 5px 8px; }
.insight svg { display: block; }
.insight .num { font-family: var(--font-display); font-weight: 600; font-size: 24px; min-width: 3ch; text-align: right; color: var(--butter); font-variant-numeric: tabular-nums; }
.insight .lbl { font-family: var(--font-label); font-size: 10px; letter-spacing: .12em; color: var(--ink-soft); }
.insight .bar { display: flex; gap: 2px; }
.insight .bar i { width: 6px; height: 12px; background: var(--line); }
.insight .bar i.on { background: var(--butter); }
.insight.low .bar i.on { background: var(--peach); }
.insight.broke .bar i.on, .insight.broke .bar i { background: var(--coral); opacity: .5; }
.floater { position: absolute; right: 10px; top: 100%; font-family: var(--font-display); font-size: 18px; pointer-events: none; animation: floatUp 1.1s steps(8) forwards; text-shadow: 2px 2px 0 #030816; }
.floater.minus { color: var(--coral); } .floater.plus { color: var(--mint); }
@keyframes floatUp { from { opacity: 0; transform: translateY(-4px); } 20% { opacity: 1; } to { opacity: 0; transform: translateY(20px); } }
.iconbtn { width: 42px; height: 42px; cursor: pointer; font-family: var(--font-display); font-size: 22px; color: var(--cyan); padding: 0; }

/* ---------- Exhibit card ---------- */
.relic-card { position: absolute; z-index: 4; top: calc(68px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); width: 236px; padding: 10px; }
.card-head { display: flex; align-items: center; gap: 8px; font-family: var(--font-label); font-size: 10px; letter-spacing: .14em; color: var(--cyan); text-transform: uppercase; margin-bottom: 8px; white-space: nowrap; }
.card-head::after { content: ""; flex: 1; border-top: 2px dashed var(--line-2); }
.photo { position: relative; display: block; width: 100%; aspect-ratio: 3 / 4; overflow: hidden; background: #1a2546; border: 2px solid var(--dark-ink); padding: 0; cursor: zoom-in; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; transition: transform 1s var(--ease); max-width: none; }
.card-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-family: var(--font-label); font-size: 10px; letter-spacing: .12em; color: var(--ink-soft); }
.zoompips { display: flex; gap: 3px; }
.zoompips i { width: 8px; height: 8px; background: var(--butter); }
.zoompips i.off { background: var(--line); }
.notes-btn { display: none; height: 22px; padding: 0 6px; border: 2px solid var(--butter); background: transparent; color: var(--butter); font-family: var(--font-label); font-size: 9px; cursor: pointer; }
.notes { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.notes:empty { display: none; }
.note { background: var(--panel-2); border-left: 4px solid var(--butter); padding: 6px 8px; font-size: 17px; line-height: 1.1; animation: rowIn .4s steps(4); }
.note .k { display: block; font-family: var(--font-label); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--butter); margin-bottom: 2px; }
.broke-banner { background: #3a1830; border-left: 4px solid var(--coral); padding: 6px 8px; font-size: 17px; line-height: 1.1; }

/* ---------- Where bar ---------- */
.wherebar {
  position: absolute; z-index: 6; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: min(1240px, calc(100% - 32px));
  display: grid; grid-template-columns: minmax(260px, 1fr) 200px auto; grid-template-areas: "status search hints"; gap: 10px; align-items: center; padding: 10px;
  animation: barIn .45s steps(6);
}
@keyframes barIn { from { opacity: 0; transform: translate(-50%, 16px); } }
.wb-status { grid-area: status; display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 42px; }
.wb-search { grid-area: search; }
.wb-hints { grid-area: hints; }
.wherebar .wb-hints { grid-template-columns: repeat(4, max-content); }
.wb-prompt { display: flex; flex-direction: column; min-width: 0; }
.wb-prompt .t { font-family: var(--font-label); font-size: 13px; letter-spacing: .08em; color: var(--ink); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wb-prompt .s { font-size: 18px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.heat-chip { display: inline-block; min-width: 46px; text-align: center; padding: 2px 6px; color: var(--dark-ink); font-family: var(--font-label); font-size: 12px; }
.arrow { display: inline-block; color: var(--cyan); transition: transform .6s var(--ease); }
.wb-status .btn-primary { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.wb-status .x { width: 42px; padding: 0; flex: none; }

.field { position: relative; }
.field input { width: 100%; height: 42px; border: 2px solid var(--line-2); background: var(--dark-ink); padding: 0 12px; font-size: 21px; color: var(--ink); }
.field input::placeholder { color: var(--ink-faint); font-family: var(--font-label); font-size: 11px; letter-spacing: .1em; }
.field input:focus { outline: none; border-color: var(--cyan); }
.suggest { position: absolute; left: 0; right: 0; bottom: 48px; z-index: 3; list-style: none; margin: 0; padding: 4px; background: var(--panel); border: 2px solid var(--frame); box-shadow: var(--drop); }
.suggest li { padding: 4px 8px; cursor: pointer; font-size: 20px; }
.suggest li.hi, .suggest li:hover { background: var(--panel-2); color: var(--cyan); }

/* hints */
.section-label { display: flex; align-items: center; gap: 8px; font-family: var(--font-label); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.section-label::after { content: ""; flex: 1; border-top: 2px dashed var(--line); order: 1; }
.section-label .free-badge { order: 2; }
.free-badge { background: var(--mint); color: var(--dark-ink); padding: 2px 6px; animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: .55; } }
.hints { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.panel .hints { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 8px; }
.hint { display: flex; justify-content: space-between; align-items: center; gap: 6px; height: 42px; border: 2px dashed var(--line-2); background: transparent; padding: 0 9px; font-family: var(--font-label); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink); cursor: pointer; text-align: left; min-width: 0; white-space: nowrap; }
.hint:hover:not(:disabled) { background: var(--panel-2); border-color: var(--cyan); }
.hint:disabled { opacity: .35; cursor: not-allowed; }
.hint .p { color: var(--butter); }
.hint .p.free { color: var(--mint); }

/* ---------- Panel (When / What) ---------- */
.panel {
  position: absolute; z-index: 6; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: min(620px, calc(100% - 32px)); max-height: 54vh;
  display: flex; flex-direction: column; animation: panelIn .55s steps(7);
}
@keyframes panelIn { from { opacity: 0; transform: translate(-50%, 40px); } }
.stepper { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 12px 14px 0; }
.chip { position: relative; padding: 6px 8px 7px; background: var(--panel-2); border: 2px solid var(--line); color: var(--ink-faint); overflow: hidden; min-width: 0; }
.chip b { display: block; font-family: var(--font-label); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: inherit; }
.chip span { display: block; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.active { border-color: var(--cyan); color: var(--cyan); }
.chip.solved { background: var(--mint); border-color: var(--mint); color: var(--dark-ink); }
.chip.solved.helped { background: var(--pink); border-color: var(--pink); }
.chip .rip { position: absolute; inset: 0; background: #fff; animation: chipRip .6s steps(4) forwards; }
@keyframes chipRip { to { opacity: 0; } }
.panel-scroll { overflow-y: auto; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 14px; flex: 1; min-height: 0; }
.phase-head h2 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 600; font-size: 26px; letter-spacing: .02em; }
.phase-head p { margin: 0; color: var(--ink-soft); font-size: 19px; line-height: 1.1; }
.phase-enter { animation: phaseIn .45s steps(5); }
@keyframes phaseIn { from { opacity: 0; transform: translateY(8px); } }
@keyframes rowIn { from { opacity: 0; transform: translateX(-6px); } }

.glist { display: flex; flex-direction: column; gap: 5px; list-style: none; margin: 0; padding: 0; }
.grow { display: grid; grid-template-columns: 1fr auto 96px; align-items: center; gap: 10px; padding: 4px 8px; background: var(--panel-2); border: 2px solid var(--line); font-size: 19px; animation: rowIn .4s steps(4); }
.grow .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grow .km { color: var(--ink-soft); }
.grow .pct { text-align: center; padding: 1px 0; font-family: var(--font-label); font-size: 10px; text-transform: uppercase; color: var(--dark-ink); }
.grow.win { border-color: var(--mint); }

/* timeline */
.yearbox { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.yearval { font-family: var(--font-display); font-weight: 700; font-size: 54px; line-height: .9; color: var(--butter); text-shadow: 4px 4px 0 #5a4314; font-variant-numeric: tabular-nums; }
.era { display: inline-flex; border: 2px solid var(--line-2); }
.era button { border: 0; background: transparent; padding: 6px 12px; font-family: var(--font-label); font-size: 11px; letter-spacing: .1em; cursor: pointer; color: var(--ink-soft); }
.era button.on { background: var(--cyan); color: var(--dark-ink); }
.tl { position: relative; height: 76px; margin: 2px 4px 0; touch-action: none; cursor: pointer; user-select: none; overflow: hidden; }
.tl-base { position: absolute; left: 0; right: 0; top: 30px; height: 10px; background: repeating-linear-gradient(90deg, #22335f 0 6px, #1a2a52 6px 12px); }
.tl-win { position: absolute; top: 28px; height: 14px; background: var(--butter); box-shadow: inset 0 -3px 0 rgba(0,0,0,.2); }
.tl-ticks span { position: absolute; top: 50px; transform: translateX(-50%); font-size: 17px; color: var(--ink-soft); white-space: nowrap; }
.tl-ticks span::before { content: ""; position: absolute; left: 50%; top: -6px; width: 2px; height: 4px; margin-left: -1px; background: var(--ink-faint); }
.tl-mark { position: absolute; top: 4px; transform: translateX(-50%); font-family: var(--font-label); font-size: 9px; padding: 2px 4px; white-space: nowrap; color: var(--dark-ink); }
.tl-mark::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 2px; height: 8px; margin-left: -1px; background: currentColor; opacity: .5; }
.tl-handle { position: absolute; top: 22px; width: 20px; height: 26px; margin-left: -10px; background: var(--ink); border: 3px solid var(--dark-ink); box-shadow: 3px 3px 0 #030816; cursor: grab; }
.tl-handle::after { content: ""; position: absolute; left: 50%; top: 4px; bottom: 4px; width: 2px; margin-left: -1px; background: var(--dark-ink); }
.tl-handle:active { cursor: grabbing; }
.nudges { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
.nudges button { height: 34px; border: 2px solid var(--line-2); background: var(--panel-2); font-size: 19px; cursor: pointer; }
.nudges button:active { background: var(--line); }

/* what */
.cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.cat { border: 2px solid var(--line-2); background: var(--panel-2); padding: 8px 4px; font-family: var(--font-label); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; min-width: 0; }
.cat.sel { border-color: var(--cyan); color: var(--cyan); }
.cat.wrong { opacity: .35; text-decoration: line-through; cursor: not-allowed; }
.cat.right { background: var(--mint); color: var(--dark-ink); }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { text-align: left; border: 2px solid var(--line-2); background: var(--panel-2); padding: 8px 12px; font-size: 20px; line-height: 1.1; cursor: pointer; transition: opacity .3s; }
.opt.sel { border-color: var(--cyan); color: var(--cyan); }
.opt.wrong { opacity: .35; text-decoration: line-through; cursor: not-allowed; }
.opt.gone { opacity: .2; cursor: not-allowed; }
.opt.right { background: var(--mint); color: var(--dark-ink); border-color: var(--mint); }

/* toast */
.toast { position: absolute; z-index: 20; left: 50%; top: calc(70px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -8px); background: var(--dark-ink); color: var(--ink); border: 2px solid var(--cyan); box-shadow: var(--drop); padding: 6px 14px; font-size: 20px; opacity: 0; transition: opacity .25s, transform .3s steps(4); pointer-events: none; max-width: min(560px, calc(100% - 32px)); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.shake { animation: shake .4s steps(4); }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

/* modals */
.scrim { position: absolute; inset: 0; z-index: 30; background: rgba(3,8,22,.72); display: grid; place-items: center; padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); animation: fadeIn .25s; }
@keyframes fadeIn { from { opacity: 0; } }
.sheet { width: 100%; max-width: 580px; max-height: 100%; overflow-y: auto; padding: 20px 22px 18px; animation: sheetIn .4s steps(5); }
@keyframes sheetIn { from { opacity: 0; transform: translateY(14px); } }
.sheet h2 { font-family: var(--font-display); font-weight: 600; font-size: 30px; margin: 0 0 8px; }
.sheet p { line-height: 1.15; margin: 0 0 10px; max-width: 65ch; }
.sheet .eyebrow { font-family: var(--font-label); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); margin-bottom: 6px; }
.sheet table { width: 100%; border-collapse: collapse; margin: 6px 0 12px; }
.sheet td { padding: 4px 0; border-bottom: 2px dashed var(--line); vertical-align: top; }
.sheet td:first-child { color: var(--ink-soft); width: 36%; padding-right: 10px; }
.sheet td.n { text-align: right; color: var(--butter); font-variant-numeric: tabular-nums; }
.reveal-top { display: grid; grid-template-columns: 170px 1fr; gap: 18px; align-items: start; margin-bottom: 10px; }
.reveal-top img { width: 100%; border: 2px solid var(--dark-ink); box-shadow: 0 0 0 2px var(--frame); background: #1a2546; }
.rank { display: inline-flex; align-items: center; gap: 8px; background: var(--butter); color: var(--dark-ink); padding: 4px 10px; font-family: var(--font-label); font-size: 12px; margin-bottom: 10px; }
.score-big { font-family: var(--font-display); font-weight: 700; font-size: 60px; line-height: 1; margin: 4px 0 10px; color: var(--butter); text-shadow: 4px 4px 0 #5a4314; }
.score-big small { font-size: 22px; color: var(--ink-soft); text-shadow: none; }
.share-pre { font-family: var(--font-ui); font-size: 19px; background: var(--dark-ink); border: 2px solid var(--line); padding: 10px 12px; white-space: pre; overflow-x: auto; margin: 8px 0 12px; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row-btns a { color: var(--cyan); margin-left: auto; font-family: var(--font-label); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.price-table td.n { width: 120px; }
.light-photo { width: min(78vw, 440px); aspect-ratio: 3/4; max-width: 100%; position: relative; overflow: hidden; border: 8px solid var(--panel); box-shadow: 0 0 0 2px var(--frame), var(--drop); background: #1a2546; }
.light-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; max-width: none; }

/* Numbers: the blocky display fonts blur 2/5/S together, so every figure uses VT323's clear terminal digits. */
.insight .num { font-family: var(--font-num); font-size: 32px; font-weight: 400; line-height: 1; }
.yearval { font-family: var(--font-num); font-weight: 400; font-size: 72px; line-height: .8; }
.score-big { font-family: var(--font-num); font-weight: 400; font-size: 84px; line-height: .85; }
.floater { font-family: var(--font-num); font-size: 24px; }
.brand .issue, .card-head, .sheet .eyebrow { font-family: var(--font-num); font-size: 17px; letter-spacing: .08em; }
.heat-chip { font-family: var(--font-num); font-size: 20px; padding: 0 6px; }
.mlabel b { font-family: var(--font-num); font-size: 16px; line-height: 1; }
.hint .p, .btn .cost, .btn .num { font-family: var(--font-num); font-size: 20px; letter-spacing: 0; }
.tl-mark { font-family: var(--font-num); font-size: 16px; padding: 0 4px; }

const PAL = {

  ul.innerHTML = suggestions.map((n, i) => `<li class="${i === suggestIdx ? "hi" : ""}" data-n="${esc(n)}">${esc(n)}</li>`).join("");
  ul.querySelectorAll("li").forEach(li => li.addEventListener("mousedown", e => { e.preventDefault(); pickSuggest(li.dataset.n); }));
}
function closeSuggest() { const ul = $("#suggest"); if (ul) ul.hidden = true; suggestions = []; }
function pickSuggest(n) {
  const inp = $("#whereInput"); inp.value = ""; closeSuggest(); inp.blur();
  if (state.where.guesses.some(g => g.name === n)) { toast(`You already guessed ${n}`); return; }
  selectedCountry = n; drawStatus(); requestRender();

}
function commitWhere() {
  const name = selectedCountry;
  if (!name || state.phase !== "where") return;
  if (state.where.guesses.some(g => g.name === name)) { toast(`You already guessed ${name}`); return; }
  const o = map.byName.get(name.toLowerCase());
  spend(COST.where);
  const correct = name === PUZZLE.country;
  const km = correct ? 0 : d3.geoDistance(o.centroid, PUZZLE.target) * R_KM;
  const pct = correct ? 100 : Math.max(0, Math.round((1 - km / (Math.PI * R_KM)) * 100));
  state.where.guesses.push({ name, km, pct, dir: correct ? 0 : bearing(o.centroid, PUZZLE.target), correct });
  selectedCountry = null;
  syncLabels(); drawStatus();
  if (correct) {
    state.where.solved = true;
    map.anim.pin = reduced() ? null : performance.now();
    requestRender(); drawStatus();
    finishPhase("where", "when", state.where.guesses.length);
  } else {
    zoomOut(); requestRender();
    toast(`${name}: ${fmtKm(km)} away`);
    save();
  }
}

/* ================= Momentum ================= */
function finishPhase(from, to, n) {
  state.momentum[from] = n;
  let msg = "";
  if (to && to !== "done" && !state.bankrupt) {
    if (n === 1) { gain(5); msg = "First try! +5 Insight"; }
  }
  if (from !== "where") { renderStepper(from); renderHints(); }
  save();
  if (msg) toast(msg, 3000);
  setTimeout(() => {
    state.phase = to; save();
    renderPhase();
    if (to === "done") setTimeout(showReveal, 500);
  }, from === "where" ? 1400 : 1100);
}

/* ================= Phase: WHEN (timeline) ================= */
const TL_MIN = -3000, TL_MAX = 2025;
const tl = { vLo: TL_MIN, vHi: TL_MAX, anim: null };
function snapStep() { const span = state.when.hi - state.when.lo; return span > 3000 ? 25 : span > 1000 ? 10 : span > 300 ? 5 : 1; }
function viewTarget() {
  const { lo, hi } = state.when, pad = Math.max(12, (hi - lo) * .08);
  return [Math.max(TL_MIN - 50, lo - pad), Math.min(TL_MAX + 50, hi + pad)];
}
function renderWhen() {
  $("#phaseBody").innerHTML = `<div class="phase-enter" style="display:flex;flex-direction:column;gap:12px">
    <div class="phase-head"><h2>When was it made?</h2><p>Slide to a year. Within <b>±${PUZZLE.tolerance} years</b> solves it. Each guess costs <b>${COST.when}</b>, and the yellow window shrinks as you learn.</p></div>
    <div class="yearbox">
      <span class="yearval" id="yearVal"></span>
      <span class="era" role="group" aria-label="Era"><button id="eraBce">BCE</button><button id="eraCe">CE</button></span>
    </div>
    <div class="tl" id="tl" aria-label="Timeline">
      <div class="tl-base"></div><div class="tl-win" id="tlWin"></div>
      <div class="tl-ticks" id="tlTicks"></div><div id="tlMarks"></div>
      <div class="tl-handle" id="tlHandle" tabindex="0" role="slider" aria-label="Year" aria-valuemin="${TL_MIN}" aria-valuemax="${TL_MAX}"></div>
    </div>
    <div class="nudges">${[-100, -10, -1, 1, 10, 100].map(n => `<button data-n="${n}">${n > 0 ? "+" : "−"}${Math.abs(n)}</button>`).join("")}</div>
    <button class="btn btn-primary" id="whenBtn">Guess this year<span class="cost">−${COST.when}</span></button>
    <ul class="glist" id="wlist"></ul></div>`;
  [tl.vLo, tl.vHi] = viewTarget();
  const el = $("#tl");
  const setFromX = clientX => {
    const r = el.getBoundingClientRect(), f = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
    setYear(tl.vLo + f * (tl.vHi - tl.vLo), true);
  };
  el.addEventListener("pointerdown", e => { el.setPointerCapture(e.pointerId); setFromX(e.clientX); $("#tlHandle").focus({ preventScroll: true }); });
  el.addEventListener("pointermove", e => { if (el.hasPointerCapture(e.pointerId)) setFromX(e.clientX); });
  $("#tlHandle").addEventListener("keydown", e => {
    const s = snapStep() * (e.shiftKey ? 10 : 1);
    if (e.key === "ArrowRight" || e.key === "ArrowUp") { e.preventDefault(); setYear(state.when.cur + s); }
    if (e.key === "ArrowLeft" || e.key === "ArrowDown") { e.preventDefault(); setYear(state.when.cur - s); }
    if (e.key === "Enter") commitWhen();
  });
  document.querySelectorAll(".nudges button").forEach(b => b.addEventListener("click", () => setYear(state.when.cur + +b.dataset.n)));
  $("#eraBce").addEventListener("click", () => { if (state.when.cur > 0) setYear(-state.when.cur); });
  $("#eraCe").addEventListener("click", () => { if (state.when.cur < 0) setYear(-state.when.cur); });
  $("#whenBtn").addEventListener("click", commitWhen);
  setYear(state.when.cur); tlDraw(); drawWhenList();
}
function setYear(v, snap) {
  const { lo, hi } = state.when;
  if (snap) { const s = snapStep(); v = Math.round(v / s) * s; }
  v = Math.round(Math.max(lo, Math.min(hi, v)));
  if (v === 0) v = state.when.cur < 0 ? 1 : -1;
  state.when.cur = v;
  const yv = $("#yearVal"); if (!yv) return;
  yv.textContent = Math.abs(v);
  $("#eraBce").classList.toggle("on", v < 0); $("#eraCe").classList.toggle("on", v > 0);
  $("#tlHandle").setAttribute("aria-valuenow", v); $("#tlHandle").setAttribute("aria-valuetext", fmtYear(v));
  const b = $("#whenBtn"); if (b) b.innerHTML = `Guess <span class="num">${fmtYear(v)}</span>${state.bankrupt ? "" : `<span class="cost">−${COST.when}</span>`}`;
  tlPlaceHandle();
}
const pctX = v => ((v - tl.vLo) / (tl.vHi - tl.vLo)) * 100;
function tlPlaceHandle() { const h = $("#tlHandle"); if (h) h.style.left = pctX(state.when.cur) + "%"; }
function tlDraw() {
  if (!$("#tl")) return;
  const { lo, hi } = state.when, span = tl.vHi - tl.vLo;
  const w = $("#tlWin"); w.style.left = pctX(lo) + "%"; w.style.width = (pctX(hi) - pctX(lo)) + "%";
  const steps = [1, 2, 5, 10, 25, 50, 100, 250, 500, 1000];
  const st = steps.find(s => span / s <= 5) || 1000;
  let ticks = ""; for (let t = Math.ceil(tl.vLo / st) * st; t <= tl.vHi; t += st) {
    const x = pctX(t); if (x < 4 || x > 96) continue;
    ticks += `<span style="left:${x}%">${t < 0 ? -t + " BCE" : t === 0 ? "1 CE" : t}</span>`;
  }
  $("#tlTicks").innerHTML = ticks;
  const bandBg = { close: "var(--butter)", warm: "var(--peach)", far: "var(--pink)", hit: "var(--mint)" };
  $("#tlMarks").innerHTML = state.when.guesses.map(g => {
    const x = pctX(g.y); if (x < -5 || x > 105) return "";
    return `<span class="tl-mark" style="left:${Math.max(3, Math.min(97, x))}%;background:${bandBg[g.band]}">${g.dir === "later" ? "→" : g.dir === "earlier" ? "←" : "✓"} ${g.y < 0 ? -g.y + "B" : g.y}</span>`;
  }).join("");

}
function tlRefresh(animate) {

  const fLo = tl.vLo, fHi = tl.vHi, t0 = performance.now();

}
function commitWhen() {
  const y = state.when.cur;

  spend(COST.when);
  const { yearLo, yearHi, tolerance: tol } = PUZZLE;
  const dist = y < yearLo ? yearLo - y : y > yearHi ? y - yearHi : 0;
  const hit = dist <= tol;
  const band = hit ? "hit" : dist <= 3 * tol ? "close" : dist <= 10 * tol ? "warm" : "far";

  if (!hit) {
    if (dir === "later") state.when.lo = Math.max(state.when.lo, y + 1); else state.when.hi = Math.min(state.when.hi, y - 1);
    state.when.cur = Math.round((state.when.lo + state.when.hi) / 2);
    zoomOut();
    toast(`${fmtYear(y)}: ${dir === "later" ? "it's later" : "it's earlier"}${band === "close" ? ", and you're close" : ""}`);
    tlRefresh(true); drawWhenList(); renderStepper(); save();

  }
}
function drawWhenList() {

  const bg = { close: "var(--butter)", warm: "var(--peach)", far: "var(--pink)", hit: "var(--mint)" };
  ul.innerHTML = [...state.when.guesses].reverse().map(g => `<li class="grow ${g.band === "hit" ? "win" : ""}">
    <span class="nm">${fmtYear(g.y)}</span>
    <span class="km">${g.dir === "later" ? "later →" : g.dir === "earlier" ? "← earlier" : "✓"}</span>
    <span class="pct" style="background:${bg[g.band]}">${lbl[g.band]}</span></li>`).join("");
}

/* ================= Phase: WHAT ================= */
let whatSel = null;
function renderWhat() {
  $("#phaseBody").innerHTML = `<div class="phase-enter" style="display:flex;flex-direction:column;gap:12px" id="whatWrap"></div>`;
  renderWhatBody();
}
function idCost() { return state.what.fnWrong.length === 0 ? COST.idDiscount : COST.id; }
function renderWhatBody() {
  const w = state.what, wrap = $("#whatWrap"); if (!wrap) return;
  whatSel = null;
  if (w.step === "fn") {
    wrap.innerHTML = `<div class="phase-head"><h2>What was it for?</h2><p>First, its function. Each guess costs <b>${COST.fn}</b>. Right on the first try discounts the final question.</p></div>
      <div class="cats">${CATEGORIES.map(c => `<button class="cat ${w.fnWrong.includes(c) ? "wrong" : ""}" data-c="${esc(c)}" ${w.fnWrong.includes(c) ? "disabled" : ""}>${esc(c)}</button>`).join("")}</div>
      <button class="btn btn-primary" id="whatBtn" disabled>Choose a function<span class="cost">−${COST.fn}</span></button>`;
    wrap.querySelectorAll(".cat").forEach(b => b.addEventListener("click", () => {
      wrap.querySelectorAll(".cat").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); whatSel = b.dataset.c;
      $("#whatBtn").disabled = false; $("#whatBtn").innerHTML = `Guess ${esc(whatSel)}${state.bankrupt ? "" : `<span class="cost">−${COST.fn}</span>`}`;
    }));
  } else {
    const c = idCost();
    wrap.innerHTML = `<div class="phase-head"><h2>Which object is it?</h2><p>It's a <b>${esc(PUZZLE.fn.toLowerCase())}</b>. Now pick the right description. Each guess costs <b>${c}</b>${c < COST.id ? " (first-try discount)" : ""}.</p></div>
      <div class="opts">${PUZZLE.options.map((o, i) => {
        const gone = w.elim && PUZZLE.eliminate.includes(i), wrong = w.idWrong.includes(i), right = w.solved && i === PUZZLE.answer;
        return `<button class="opt ${gone ? "gone" : ""} ${wrong ? "wrong" : ""} ${right ? "right" : ""}" data-i="${i}" ${gone || wrong || w.solved ? "disabled" : ""}>${esc(o)}</button>`;
      }).join("")}</div>
      <button class="btn btn-primary" id="whatBtn" disabled>Choose a description<span class="cost">−${c}</span></button>`;
    wrap.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      wrap.querySelectorAll(".opt").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); whatSel = +b.dataset.i;
      $("#whatBtn").disabled = false; $("#whatBtn").innerHTML = `Lock it in${state.bankrupt ? "" : `<span class="cost">−${c}</span>`}`;
    }));
  }
  $("#whatBtn").addEventListener("click", commitWhat);
}
function commitWhat() {
  const w = state.what; if (whatSel === null) return;
  if (w.step === "fn") {
    spend(COST.fn);
    if (whatSel === PUZZLE.fn) {
      w.fnSolved = true; w.step = "id";
      toast(w.fnWrong.length === 0 ? `Yes, a ${PUZZLE.fn.toLowerCase()}. The next guess is discounted.` : `Yes, a ${PUZZLE.fn.toLowerCase()}`);
      renderStepper("what"); renderWhatBody(); renderHints();
    } else {
      w.fnWrong.push(whatSel); zoomOut(); toast(`Not a ${whatSel.toLowerCase()}`); renderWhatBody();
    }
  } else {
    spend(idCost());
    if (whatSel === PUZZLE.answer) {
      w.solved = true; renderWhatBody();
      finishPhase("what", "done", w.fnWrong.length + w.idWrong.length + 2);

    }

  }

/* ================= Global scores (Supabase) =================
   Each finished first play posts one row (puzzle, anonymous player id, score). Raw rows aren't readable;
   score_dist() returns only counts per score. Leave these blank and the score sheet says it isn't connected. */
const SUPABASE_URL = "";
const SUPABASE_KEY = "";   // the project's public "anon" key, meant to be used in browsers
const SCORE_MAX = 130, BIN = 10;
function playerId() {
  try {
    let id = localStorage.getItem("relic-player");
    if (!id) { id = crypto.randomUUID(); localStorage.setItem("relic-player", id); }
    return id;
  } catch (e) { return null; }
}
function sb(path, body, prefer) {
  return fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", ...(prefer ? { Prefer: prefer } : {}) },
    body: JSON.stringify(body)
  }).then(r => { if (!r.ok) throw new Error(r.status); return r.status === 204 ? null : r.json(); });
}
async function submitScore() {
  if (!SUPABASE_URL || state.practice || state.submitted) return;
  const id = playerId(); if (!id) return;
  try {
    await sb("scores?on_conflict=puzzle_no,player_id", { puzzle_no: PUZZLE.no, player_id: id, score: score().total }, "resolution=ignore-duplicates,return=minimal");
    state.submitted = true; save();
  } catch (e) {}
}
async function loadDistribution(mine) {
  const box = $("#dist"); if (!box) return;
  const msg = t => { box.innerHTML = `<div class="eyebrow">Today's players</div><p class="dist-msg">${t}</p>`; };
  if (!SUPABASE_URL) { msg("Global scores aren't connected yet. Once they are, you'll see how you compare with everyone who played today."); return; }
  await submitScore();
  let rows;
  try { rows = await sb("rpc/score_dist", { p_no: PUZZLE.no }); } catch (e) { msg("Couldn't load today's scores. Try again later."); return; }
  if (!$("#dist")) return;
  renderDistribution(rows.map(r => ({ score: +r.score, n: +r.n })), mine);
}
function renderDistribution(rows, mine) {
  const bins = Array.from({ length: SCORE_MAX / BIN + 1 }, (_, i) => ({ lo: i * BIN, n: 0 }));
  let total = 0, below = 0, same = 0;
  for (const { score: sc, n } of rows) {
    bins[Math.min(bins.length - 1, Math.floor(Math.max(0, sc) / BIN))].n += n;
    total += n; if (sc < mine) below += n; else if (sc === mine) same += n;
  }
  const others = total - (state.practice ? 0 : 1);
  // Percentile: players you beat, plus half of any ties (not counting yourself).
  const pct = others > 0 ? Math.round(100 * (below + Math.max(0, same - 1) / 2) / others) : null;
  const myBin = Math.min(bins.length - 1, Math.floor(mine / BIN)), peak = Math.max(1, ...bins.map(b => b.n));
  $("#dist").innerHTML = `<div class="eyebrow">Today's players · ${total.toLocaleString("en-US")}</div>
    <p class="dist-head">${pct === null ? "You're the first to finish today." : `Better than <b>${pct}%</b> of today's players`}</p>
    <div class="dist-chart" role="img" aria-label="Score distribution. Your score ${mine} is in the ${myBin * BIN} to ${myBin * BIN + BIN - 1} range.">
      ${bins.map((b, i) => { const h = b.n ? Math.max(4, Math.round(b.n / peak * 100)) : 0; return `<div class="dist-col${i === myBin ? " me" : ""}" data-tip="${b.lo}${i === bins.length - 1 ? "+" : "–" + (b.lo + BIN - 1)}: ${b.n} player${b.n === 1 ? "" : "s"}">
        ${i === myBin ? `<span class="you" style="bottom:calc(${h}% + 4px)">YOU</span>` : ""}<i style="height:${h}%"></i></div>`; }).join("")}
    </div>
    <div class="dist-axis">${bins.map((b, i) => `<span>${i % 2 === 0 ? b.lo : ""}</span>`).join("")}</div>
    <table class="dist-table" hidden>${bins.map(b => `<tr><td>${b.lo}–${b.lo + BIN - 1}</td><td class="n">${b.n}</td></tr>`).join("")}</table>`;
  const tip = $("#tip");
  $("#dist").querySelectorAll(".dist-col").forEach(c => {
    c.addEventListener("pointerenter", e => { tip.hidden = false; tip.style.zIndex = 40; tip.textContent = c.dataset.tip; });
    c.addEventListener("pointermove", e => { tip.style.left = (e.clientX + 12) + "px"; tip.style.top = (e.clientY - 30) + "px"; });
    c.addEventListener("pointerleave", () => { tip.hidden = true; });
  });
}

/* ================= Done / reveal ================= */
function score() {
  if (state.bankrupt) return { total: 0, parts: [] };
  const parts = [["Insight left", state.insight], [`Zoom bonus (${state.zoom} unrevealed × 3)`, state.zoom * 3], ["Find-spot bonus", 5]];
  return { total: parts.reduce((a, p) => a + p[1], 0), parts };
}
function rank(t) {

}

}

}

    ${s.parts.length ? `<div class="eyebrow">Score</div><table>${s.parts.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n">${v}</td></tr>`).join("")}<tr><td>Total</td><td class="n">${s.total}</td></tr></table>` : ""}

function modal(html, onClose) {

function showHelp() {

  const close = modal(`<div class="sheet box" role="dialog" aria-modal="true" aria-label="How to play">
    <div class="eyebrow">How to play</div><h2>Find where, when and what</h2>
    <p>Each day brings one real object from The Met's open-access collection, shown as a tight close-up.</p>
    <p><b>1. Where.</b> Drag to spin the globe, and scroll or pinch to zoom. Tap a country, then tap it again (or press Guess) to lock it in. Misses light up by how close they were. <b>2. When.</b> Find the right country and the map zooms in. Slide the timeline to the year it was made. <b>3. What.</b> Pick its function, then which object it is.</p>
    <p>You start with <b>100 Insight</b>. Guesses and hints spend it. Every miss pulls the photo back one step. Whatever Insight is left becomes your score.</p>
    <table class="price-table">${rows.map(([k, v]) => `<tr><td>${k}</td><td class="n">${v}</td></tr>`).join("")}</table>
    <p><b>Hints.</b> Your first hint of the game is free. After that, hints cost Insight. <b>First try.</b> Solve Where or When on your first guess for +5 Insight.</p>
    <p><b>Bonuses.</b> +3 for every zoom level you never revealed, and +5 for the find-spot. Run out of Insight and you can keep playing for free, but the score drops to 0.</p>
    <div class="row-btns"><button class="btn btn-primary" id="startBtn">${state.where.guesses.length ? "Back to the dig" : "Start digging"}</button></div></div>`,
    () => { if (!state.seenHelp) { state.seenHelp = true; save(); } });
  $("#startBtn").addEventListener("click", close);
}
function showNotes() {
  const close = modal(`<div class="sheet box" role="dialog" aria-modal="true" aria-label="Field notes"><div class="eyebrow">Field notes</div><div class="notes" style="display:flex">${notesHtml()}</div>
    <div class="row-btns" style="margin-top:12px"><button class="btn btn-primary" id="notesClose">Close</button></div></div>`);
  $("#notesClose").addEventListener("click", close);
}
function showLightbox() {
  modal(`<div class="light-photo"><img src="${PUZZLE.image}" alt="Enlarged close-up of today's relic" draggable="false"></div>`);
  const img = document.querySelector(".light-photo img");
  img.style.transition = "none";
  if (state.phase === "done") img.style.transform = "none"; else applyZoom(img, state.zoom);
  $(".light-photo").addEventListener("click", () => { $("#modalRoot").innerHTML = ""; });
}
function resetGame() {
  const seen = state.seenHelp;
  state = freshState(); state.seenHelp = seen; state.practice = true; save();
  $("#modalRoot").innerHTML = "";
  shownInsight = 100; tweenInsight();
  selectedCountry = null; map.focused = false; map.anim = {};
  syncLabels(); renderPhase(); renderZoom();
  flyTo([20, 18], 1, 900);
}

/* ================= Phase router ================= */
function renderPhase() {
  const where = state.phase === "where";
  $("#wherebar").hidden = !where; $("#panel").hidden = where;
  if (where) renderWhere();
  else {
    renderStepper();
    if (state.phase === "when") renderWhen();
    else if (state.phase === "what") renderWhat();
    else renderDone();
    $("#panelScroll").scrollTop = 0;
  }
  if (state.phase === "done") renderZoomFull();
  renderHints(); renderNotes(); requestRender();
  if (!where && !map.focused && map.cv) {
    map.focused = true;
    requestAnimationFrame(() => fitCountry(map.byName.get(PUZZLE.country.toLowerCase()), 1400));
  }
}
function renderZoomFull() {
  const img = $("#relicImg"); img.style.transform = "scale(1) translate(0,0)";
  $("#zoomPips").innerHTML = [5, 4, 3, 2, 1].map(() => `<i class="off"></i>`).join("");
}

/* ================= Boot ================= */
async function start(data) {
  try {
    PUZZLES = (await fetch("puzzles.json", { cache: "no-cache" }).then(r => r.json())).puzzles;
  } catch (e) { toast("Today's relic couldn't load. Refresh to try again.", 6000); return; }
  PUZZLE = puzzleFor(todayISO());
  PUZZLE.dateText = dateLabel(PUZZLE.date);
  STORE_KEY = "relic-" + PUZZLE.no;
  state = (data && data.state && data.no === PUZZLE.no && data.state) || load() || freshState();
  if (state.freeHint === undefined) { state.freeHint = !state.hintsUsed; delete state.free; }
  shownInsight = state.insight;
  $("#relicImg").src = PUZZLE.image;
  $("#issue").textContent = `No. ${PUZZLE.no} · ${PUZZLE.day} ${PUZZLE.dateText}`;
  $("#cardHead").textContent = `Exhibit #${PUZZLE.no}`;
  $("#insightNum").textContent = state.insight; tweenInsight();
  $("#fx").innerHTML = Array.from({ length: 22 }, () => `<i class="tw" style="left:${(Math.random() * 100).toFixed(1)}%;top:${(Math.random() * 100).toFixed(1)}%;animation-delay:${(Math.random() * 5).toFixed(2)}s"></i>`).join("");
  renderZoom();
  $("#helpBtn").addEventListener("click", showHelp);
  $("#photoBtn").addEventListener("click", showLightbox);
  $("#notesBtn").addEventListener("click", showNotes);
  try { await initMap(); } catch (e) { toast("The map couldn't load. Refresh to try again.", 5000); }
  syncLabels();
  renderPhase();
  if (state.phase === "done") renderZoomFull();
  if (!state.seenHelp) showHelp();
  watchMidnight();
}

/* ================= Midnight rollover =================
   At local midnight (or when a sleeping tab wakes on a new day) a new relic may be out. Swap straight to it
   if the player hasn't started or has finished; otherwise offer it without interrupting their game. */
function watchMidnight() {
  const check = async () => {
    try { PUZZLES = (await fetch("puzzles.json", { cache: "no-cache" }).then(r => r.json())).puzzles; } catch (e) {}
    const next = puzzleFor(todayISO());
    if (next.no === PUZZLE.no) return;
    const idle = state.phase === "done" || (state.phase === "where" && !state.where.guesses.length);
    if (idle) { location.reload(); return; }
    const t = $("#toast");
    t.innerHTML = `A new relic is out. <button class="btn btn-primary" id="newRelic" style="height:30px;margin-left:8px;pointer-events:auto">Play No. ${esc(next.no)}</button>`;
    t.classList.add("show"); t.style.pointerEvents = "auto"; clearTimeout(toastTimer);
    $("#newRelic").addEventListener("click", () => location.reload());
  };
  const arm = () => {
    const now = new Date(), mid = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5);
    setTimeout(() => { check(); arm(); }, mid - now);
  };
  arm();
  let lastDay = localISO();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && localISO() !== lastDay) { lastDay = localISO(); check(); }
  });
}
if (window.claude?.hot?.snapshot) window.claude.hot.snapshot(() => ({ state, no: PUZZLE?.no }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
