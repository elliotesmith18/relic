<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relic</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<meta name="description" content="A daily history puzzle: find where, when and what a real museum relic is.">
<meta property="og:title" content="Relic: a daily history puzzle">
<meta property="og:description" content="Where was it made? When? What is it? One real museum object a day.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://elliotesmith18.github.io/relic/">
<meta property="og:image" content="https://elliotesmith18.github.io/relic/og-image.jpg">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: a full-bleed vintage atlas is the stage; the relic floats on it as a taped polaroid, and a docked field console runs the three phases. */
:root {
  color-scheme: light;
  --paper: #f6f0e2;
  --paper-2: #efe6d1;
  --sea: #d3e3e4;
  --sea-line: #bcd2d4;
  --land: #e9dfc6;
  --land-2: #e4d8bc;
  --land-3: #ede5d0;
  --ink: #3a3946;
  --ink-soft: #6c6878;
  --ink-faint: #a49f97;
  --accent: #4d7a86;
  --accent-ink: #f8f4ea;
  --rose: #e9b7b1;
  --sage: #b3cfa9;
  --sage-deep: #6f9a62;
  --butter: #f1db97;
  --peach: #f4bf95;
  --coral: #e98d7d;
  --lavender: #c8c1e4;
  --shadow: 0 1px 2px rgba(58,57,70,.08), 0 8px 28px rgba(58,57,70,.12);
  --font-display: "Young Serif", "Iowan Old Style", Georgia, serif;
  --font-ui: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
}
html, body { height: 100%; }
body { background: var(--sea); color: var(--ink); font-family: var(--font-ui); font-size: 15px; overflow: hidden; }
button { font: inherit; color: inherit; }
*:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { position: fixed; inset: 0; }

/* ---------- Map ---------- */
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#map:active { cursor: grabbing; }
.sphere { fill: var(--sea); }
.graticule { fill: none; stroke: var(--sea-line); stroke-width: .6; vector-effect: non-scaling-stroke; }
.country { stroke: #b9ab8c; stroke-width: .55; vector-effect: non-scaling-stroke; transition: fill .6s var(--ease), opacity .6s var(--ease); cursor: pointer; }
.country:hover { filter: brightness(.97); }
.country.dim { opacity: .35; }
.country.sel { stroke: var(--ink); stroke-width: 1.6; }
.country.guessed { stroke: #8f7f63; }
.ring { fill: rgba(77,122,134,.06); stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 5 5; vector-effect: non-scaling-stroke; animation: dash 18s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -200; } }
.glabel { font-family: var(--font-ui); font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.ripple { fill: none; stroke: var(--sage-deep); stroke-width: 2; vector-effect: non-scaling-stroke; }
.pin-body { fill: var(--coral); stroke: var(--ink); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
.pin-dot { fill: var(--paper); }

/* ---------- Top bar ---------- */
.topbar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 5;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.brand { display: flex; align-items: baseline; gap: 10px; background: var(--paper); padding: 6px 14px 7px; border-radius: 999px; box-shadow: var(--shadow); }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; letter-spacing: .01em; }
.brand .issue { font-family: var(--font-data); font-size: 11.5px; color: var(--ink-soft); letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.right-tools { display: flex; align-items: center; gap: 8px; }
.insight { position: relative; display: flex; align-items: center; gap: 10px; background: var(--paper); padding: 6px 14px 6px 8px; border-radius: 999px; box-shadow: var(--shadow); }
.coin { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fbeab5, var(--butter) 55%, #d9bd6a); border: 1.5px solid #c9a94f; display: grid; place-items: center; font-family: var(--font-display); font-size: 13px; color: #7a6223; }
.insight .num { font-family: var(--font-data); font-weight: 500; font-size: 18px; font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
.insight .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.insight .bar { width: 64px; height: 6px; border-radius: 3px; background: var(--paper-2); overflow: hidden; }
.insight .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--peach), var(--butter)); border-radius: 3px; transition: width .6s var(--ease); }
.insight.broke .bar i { background: var(--rose); }
.floater { position: absolute; right: 14px; top: 100%; font-family: var(--font-data); font-weight: 500; font-size: 14px; pointer-events: none; animation: floatUp 1.1s var(--ease) forwards; }
.floater.minus { color: #b4574a; } .floater.plus { color: var(--sage-deep); }
@keyframes floatUp { from { opacity: 0; transform: translateY(-6px); } 20% { opacity: 1; } to { opacity: 0; transform: translateY(18px); } }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--paper); box-shadow: var(--shadow); cursor: pointer; font-family: var(--font-display); font-size: 17px; }

/* ---------- Polaroid ---------- */
.polaroid {
  position: absolute; z-index: 4; margin: 0;
  top: calc(70px + env(safe-area-inset-top, 0px)); left: max(20px, calc(env(safe-area-inset-left, 0px) + 12px));
  width: 250px; max-width: 100%; background: #fffdf7; padding: 10px 10px 0; box-shadow: var(--shadow);
  transform: rotate(-2.2deg); transition: transform .5s var(--ease); cursor: zoom-in; border: 0;
}
.polaroid:hover { transform: rotate(-1deg) translateY(-2px); }
.polaroid::before { content: ""; position: absolute; top: -10px; left: 50%; width: 84px; height: 22px; transform: translateX(-50%) rotate(3deg); background: rgba(241,219,151,.75); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.photo { position: relative; aspect-ratio: 3 / 4; max-width: 100%; overflow: hidden; background: #ddd8cf; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; transition: transform 1s var(--ease); max-width: none; }
.polaroid figcaption { display: flex; justify-content: space-between; align-items: center; padding: 9px 2px 11px; font-family: var(--font-data); font-size: 11.5px; color: var(--ink-soft); letter-spacing: .03em; }
.zoompips { display: flex; gap: 3px; }
.zoompips i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); transition: background .4s; }
.zoompips i.off { background: #d9d2c4; }

/* ---------- Console ---------- */
.console {
  position: absolute; z-index: 6; right: max(16px, env(safe-area-inset-right, 0px));
  top: calc(70px + env(safe-area-inset-top, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: 384px; max-width: calc(100% - 32px); display: flex; flex-direction: column;
  background: var(--paper); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden;
}
.console-scroll { overflow-y: auto; padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 16px; flex: 1; min-height: 0; }
.stepper { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 14px 18px 0; }
.chip { position: relative; border-radius: 12px; padding: 8px 10px 9px; background: var(--paper-2); color: var(--ink-faint); transition: background .4s var(--ease), color .4s; overflow: hidden; min-width: 0; }
.chip b { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; }
.chip span { display: block; font-size: 12.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.active { background: var(--ink); color: var(--paper); }
.chip.solved { background: var(--sage); color: var(--ink); }
.chip.solved.helped { background: var(--rose); }
.chip .rip { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: rgba(255,255,255,.7); animation: chipRip .9s var(--ease) forwards; }
@keyframes chipRip { to { transform: scale(30); opacity: 0; } }

.phase-head h2 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 400; font-size: 23px; text-wrap: balance; }
.phase-head p { margin: 0; color: var(--ink-soft); font-size: 14px; line-height: 1.45; }
.phase-enter { animation: phaseIn .55s var(--ease); }
@keyframes phaseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.field { position: relative; display: flex; gap: 8px; }
.field input { flex: 1; min-width: 0; height: 44px; border-radius: 12px; border: 1.5px solid #d8ccb1; background: #fffdf7; padding: 0 14px; font: inherit; font-size: 15.5px; color: var(--ink); }
.field input:focus { outline: none; border-color: var(--accent); }
.suggest { position: absolute; left: 0; right: 0; top: 48px; z-index: 3; list-style: none; margin: 0; padding: 4px; background: #fffdf7; border-radius: 12px; box-shadow: var(--shadow); }
.suggest li { padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14.5px; }
.suggest li.hi, .suggest li:hover { background: var(--paper-2); }
.btn { height: 44px; border: 0; border-radius: 12px; padding: 0 16px; font-weight: 600; cursor: pointer; transition: transform .15s var(--ease), background .2s, opacity .2s; white-space: nowrap; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.btn .cost { font-family: var(--font-data); font-weight: 500; opacity: .85; margin-left: 6px; font-size: 13px; }
.btn-ghost { background: var(--paper-2); color: var(--ink); }

.glist { display: flex; flex-direction: column; gap: 6px; list-style: none; margin: 0; padding: 0; }
.grow { display: grid; grid-template-columns: 1fr auto auto 54px; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--paper-2); font-size: 14px; animation: rowIn .45s var(--ease); }
@keyframes rowIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
.grow .nm { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grow .km, .grow .pct { font-family: var(--font-data); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.grow .pct { text-align: center; padding: 2px 0; border-radius: 6px; font-weight: 500; }
.arrow { display: inline-block; font-size: 15px; transition: transform .6s var(--ease); }
.grow.win { background: var(--sage); }

/* timeline */
.yearbox { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.yearval { font-family: var(--font-display); font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.era { display: inline-flex; border-radius: 999px; background: var(--paper-2); padding: 3px; }
.era button { border: 0; background: transparent; border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 700; letter-spacing: .08em; cursor: pointer; color: var(--ink-soft); }
.era button.on { background: var(--ink); color: var(--paper); }
.tl { position: relative; height: 74px; margin: 2px 4px 0; touch-action: none; cursor: pointer; user-select: none; overflow: hidden; }
.tl-base { position: absolute; left: 0; right: 0; top: 30px; height: 10px; border-radius: 5px; background: repeating-linear-gradient(90deg, #e6dcc4 0 6px, #ede5d2 6px 12px); }
.tl-win { position: absolute; top: 28px; height: 14px; border-radius: 7px; background: var(--butter); box-shadow: inset 0 0 0 1.5px #d7bd6c; }
.tl-ticks span { position: absolute; top: 48px; transform: translateX(-50%); font-family: var(--font-data); font-size: 10.5px; color: var(--ink-soft); white-space: nowrap; }
.tl-ticks span::before { content: ""; position: absolute; left: 50%; top: -7px; width: 1px; height: 5px; background: var(--ink-faint); }
.tl-mark { position: absolute; top: 6px; transform: translateX(-50%); font-family: var(--font-data); font-size: 10px; padding: 2px 5px; border-radius: 6px; white-space: nowrap; color: var(--ink); }
.tl-mark::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 2px; height: 8px; margin-left: -1px; background: currentColor; opacity: .4; }
.tl-handle { position: absolute; top: 22px; width: 26px; height: 26px; margin-left: -13px; border-radius: 50%; background: var(--ink); border: 3px solid var(--paper); box-shadow: 0 2px 6px rgba(0,0,0,.25); cursor: grab; }
.tl-handle:active { cursor: grabbing; transform: scale(1.1); }
.nudges { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
.nudges button { height: 32px; border: 0; border-radius: 8px; background: var(--paper-2); font-family: var(--font-data); font-size: 12px; cursor: pointer; }
.nudges button:active { background: #e3d8bf; }

/* what */
.cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.cat { border: 1.5px solid transparent; border-radius: 10px; background: var(--paper-2); padding: 9px 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .2s, border-color .2s, opacity .3s; min-width: 0; }
.cat.sel { border-color: var(--ink); background: #fffdf7; }
.cat.wrong { opacity: .4; text-decoration: line-through; cursor: not-allowed; }
.cat.right { background: var(--sage); }
.opts { display: flex; flex-direction: column; gap: 7px; }
.opt { text-align: left; border: 1.5px solid transparent; border-radius: 12px; background: var(--paper-2); padding: 11px 13px; font-size: 14px; line-height: 1.4; cursor: pointer; transition: background .2s, border-color .2s, opacity .3s, transform .3s var(--ease); }
.opt.sel { border-color: var(--ink); background: #fffdf7; }
.opt.wrong { opacity: .4; text-decoration: line-through; cursor: not-allowed; }
.opt.gone { opacity: .25; transform: scale(.98); cursor: not-allowed; }
.opt.right { background: var(--sage); }

/* hints + notes */
.section-label { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); display: flex; justify-content: space-between; align-items: center; }
.free-badge { background: var(--sage); color: var(--ink); padding: 2px 8px; border-radius: 999px; letter-spacing: .06em; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
.hints { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.hint { display: flex; justify-content: space-between; align-items: center; gap: 6px; border: 1.5px dashed #cdbf9f; border-radius: 10px; background: transparent; padding: 8px 10px; font-size: 13px; cursor: pointer; text-align: left; transition: background .2s, opacity .2s; min-width: 0; }
.hint:hover:not(:disabled) { background: var(--paper-2); }
.hint:disabled { opacity: .4; cursor: not-allowed; }
.hint .p { font-family: var(--font-data); font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
.hint .p.free { color: var(--sage-deep); font-weight: 500; }
.notes { display: flex; flex-direction: column; gap: 6px; }
.note { background: #fbf2d4; border-radius: 10px; padding: 9px 12px; font-size: 13.5px; line-height: 1.45; animation: rowIn .45s var(--ease); }
.note b { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); display: block; margin-bottom: 2px; }
.broke-banner { background: var(--rose); border-radius: 10px; padding: 9px 12px; font-size: 13.5px; }

/* toast */
.toast { position: absolute; z-index: 20; left: 50%; top: calc(76px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -10px); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; opacity: 0; transition: opacity .3s, transform .4s var(--ease); pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 900px) { .toast { left: calc(50% - 200px); max-width: calc(100% - 460px); } }
.shake { animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }

/* modals */
.scrim { position: absolute; inset: 0; z-index: 30; background: rgba(58,57,70,.35); display: grid; place-items: center; padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); animation: fadeIn .3s; }
@keyframes fadeIn { from { opacity: 0; } }
.sheet { background: var(--paper); border-radius: 20px; box-shadow: var(--shadow); width: 100%; max-width: 560px; max-height: 100%; overflow-y: auto; padding: 22px 22px 20px; animation: sheetIn .5s var(--ease); }
@keyframes sheetIn { from { opacity: 0; transform: translateY(16px) scale(.98); } }
.sheet h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; margin: 0 0 6px; text-wrap: balance; }
.sheet p { line-height: 1.55; margin: 0 0 10px; max-width: 65ch; }
.sheet .eyebrow { font-family: var(--font-data); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 6px; }
.sheet table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 6px 0 12px; }
.sheet td { padding: 6px 0; border-bottom: 1px solid #e6dcc6; vertical-align: top; }
.sheet td:first-child { color: var(--ink-soft); width: 34%; padding-right: 10px; }
.sheet td.n { font-family: var(--font-data); text-align: right; font-variant-numeric: tabular-nums; }
.reveal-top { display: grid; grid-template-columns: 170px 1fr; gap: 18px; align-items: start; margin-bottom: 8px; }
.reveal-top img { width: 100%; border-radius: 10px; background: #ddd8cf; }
.rank { display: inline-flex; align-items: center; gap: 8px; background: var(--butter); border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: 14px; margin-bottom: 10px; }
.score-big { font-family: var(--font-display); font-size: 48px; line-height: 1; margin: 4px 0 8px; }
.share-pre { font-family: var(--font-data); font-size: 13px; background: var(--paper-2); border-radius: 12px; padding: 12px 14px; white-space: pre; overflow-x: auto; margin: 8px 0 12px; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.row-btns a { color: var(--accent); font-weight: 600; align-self: center; margin-left: auto; }
.price-table td.n { width: 70px; }
.light-photo { width: min(78vw, 440px); aspect-ratio: 3/4; max-width: 100%; position: relative; overflow: hidden; border-radius: 6px; border: 10px solid #fffdf7; box-shadow: var(--shadow); background: #ddd8cf; }
.light-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; max-width: none; }

/* ---------- Phone ---------- */
@media (max-width: 899px) {
  .brand .issue { display: none; }
  .insight .bar, .insight .lbl { display: none; }
  .polaroid { width: 118px; padding: 6px 6px 0; top: calc(62px + env(safe-area-inset-top, 0px)); }
  .polaroid figcaption { padding: 5px 0 7px; font-size: 10px; }
  .polaroid figcaption .zl { display: none; }
  .console { left: 0; right: 0; bottom: 0; top: auto; width: 100%; max-width: 100%; height: 56%; border-radius: 20px 20px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .stepper, .console-scroll { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .reveal-top { grid-template-columns: 110px 1fr; gap: 14px; }
  .score-big { font-size: 38px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div id="app">
  <svg id="map" aria-label="World map. Click a country to select it as your guess."></svg>

  <header class="topbar">
    <div class="brand"><h1>Relic</h1><span class="issue" id="issue"></span></div>
    <div class="right-tools">
      <div class="insight" id="insight" title="Insight: your daily budget. Guesses and hints spend it; what's left is your score.">
        <span class="coin">i</span>
        <span class="num" id="insightNum">100</span>
        <span class="lbl">Insight</span>
        <span class="bar"><i id="insightBar" style="width:100%"></i></span>
      </div>
      <button class="iconbtn" id="helpBtn" aria-label="How to play">?</button>
    </div>
  </header>

  <button class="polaroid" id="polaroid" aria-label="Enlarge the relic photo">
    <div class="photo"><img id="relicImg" src="relic.jpg" alt="A close-up detail of today's relic" draggable="false"></div>
    <figcaption><span class="zl">ZOOM</span><span class="zoompips" id="zoomPips"></span></figcaption>
  </button>

  <section class="console" id="console" aria-live="polite">
    <div class="stepper" id="stepper"></div>
    <div class="console-scroll" id="consoleScroll">
      <div id="phaseBody"></div>
      <div id="hintBox"></div>
      <div class="notes" id="notes"></div>
    </div>
  </section>

const CATEGORIES = ["Weapon", "Vessel", "Adornment", "Ritual", "Tool", "Currency", "Writing", "Instrument", "Textile", "Funerary", "Toy / Game", "Furniture"];

/* ================= Geography helpers ================= */
const DISPLAY = {
  "Bosnia and Herz.": "Bosnia and Herzegovina", "Central African Rep.": "Central African Republic",
  "Dem. Rep. Congo": "DR Congo", "Dominican Rep.": "Dominican Republic", "Eq. Guinea": "Equatorial Guinea",
  "S. Sudan": "South Sudan", "Solomon Is.": "Solomon Islands", "Falkland Is.": "Falkland Islands",
  "W. Sahara": "Western Sahara", "N. Cyprus": "Northern Cyprus", "Macedonia": "North Macedonia",
  "eSwatini": "Eswatini", "United States of America": "United States", "Côte d'Ivoire": "Côte d'Ivoire"
};
const ALIASES = {
  "usa": "United States", "us": "United States", "america": "United States", "uk": "United Kingdom",
  "britain": "United Kingdom", "great britain": "United Kingdom", "england": "United Kingdom", "scotland": "United Kingdom",
  "czech republic": "Czechia", "ivory coast": "Côte d'Ivoire", "drc": "DR Congo", "burma": "Myanmar",
  "persia": "Iran", "siam": "Thailand", "korea": "South Korea", "holland": "Netherlands", "uae": "United Arab Emirates",
  "swaziland": "Eswatini", "east timor": "Timor-Leste", "bosnia": "Bosnia and Herzegovina"
};
const EXCLUDE = new Set(["Antarctica", "Fr. S. Antarctic Lands"]);
const ASIA = new Set(["Afghanistan","Armenia","Azerbaijan","Bangladesh","Bhutan","Brunei","Cambodia","China","Georgia","India","Indonesia","Iran","Iraq","Israel","Japan","Jordan","Kazakhstan","Kuwait","Kyrgyzstan","Laos","Lebanon","Malaysia","Mongolia","Myanmar","Nepal","North Korea","Oman","Pakistan","Palestine","Philippines","Qatar","Russia","Saudi Arabia","South Korea","Sri Lanka","Syria","Taiwan","Tajikistan","Thailand","Timor-Leste","Turkey","Turkmenistan","United Arab Emirates","Uzbekistan","Vietnam","Yemen"]);
const R_KM = 6371;
const toRad = d => d * Math.PI / 180, toDeg = r => r * 180 / Math.PI;
function bearing(a, b) {
  const [l1, p1] = a.map(toRad), [l2, p2] = b.map(toRad);
  const y = Math.sin(l2 - l1) * Math.cos(p2);
  const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(l2 - l1);
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}
function heat(pct) {
  if (pct >= 94) return "var(--coral)";
  if (pct >= 85) return "var(--peach)";
  if (pct >= 70) return "var(--butter)";
  return "var(--lavender)";
}
function heatEmoji(pct) { return pct >= 94 ? "🟥" : pct >= 85 ? "🟧" : pct >= 70 ? "🟨" : "🟦"; }

/* ================= State ================= */
const STORE_KEY = "relic-" + PUZZLE.no;
function freshState() {
  return {
    v: 1, phase: "where", insight: 100, zoom: 5, bankrupt: false, hintsUsed: 0,
    where: { guesses: [], solved: false },
    when: { guesses: [], lo: -3000, hi: 2025, cur: 1000, solved: false },
    what: { step: "fn", fnWrong: [], fnSolved: false, idWrong: [], elim: false, solved: false },
    used: {}, free: { when: false, what: false }, notes: [], momentum: {}, seenHelp: false
  };
}
let state;
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
function load() { try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); return s && s.v === 1 ? s : null; } catch (e) { return null; } }

/* ================= DOM helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function fmtYear(y) { return y < 0 ? `${-y} BCE` : `${y} CE`; }
function fmtKm(k) { return Math.round(k).toLocaleString("en-US") + " km"; }
let toastTimer;
function toast(msg, ms = 2200) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), ms);
}
function shake(el) { if (!el) return; el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }

/* ================= Insight economy ================= */
let shownInsight = 100;
function tweenInsight() {
  const el = $("#insightNum"), from = shownInsight, to = state.insight, t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / 500), e = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step); else shownInsight = to;
  };
  requestAnimationFrame(step);
  $("#insightBar").style.width = Math.max(0, Math.min(100, state.insight)) + "%";
  $("#insight").classList.toggle("broke", state.bankrupt);
}
function floater(text, cls) {
  const f = document.createElement("span"); f.className = "floater " + cls; f.textContent = text;
  $("#insight").appendChild(f); setTimeout(() => f.remove(), 1200);
}
function spend(cost) {
  if (state.bankrupt || cost <= 0) return 0;
  const paid = Math.min(cost, state.insight);
  state.insight -= paid;
  floater("−" + paid, "minus");
  if (state.insight <= 0) {
    state.insight = 0; state.bankrupt = true;
    toast("Out of Insight. Keep going for free, but today's score is 0.", 3200);
  }
  tweenInsight();
  return paid;
}
function gain(n) { if (state.bankrupt) return; state.insight += n; floater("+" + n, "plus"); tweenInsight(); }

/* ================= Relic photo ================= */
function applyZoom(img, level) {
  const z = PUZZLE.zooms[level], lim = .5 - .5 / z.s;
  const tx = Math.max(-lim, Math.min(lim, .5 - z.x)) * 100, ty = Math.max(-lim, Math.min(lim, .5 - z.y)) * 100;
  img.style.transform = `scale(${z.s}) translate(${tx}%, ${ty}%)`;
}
function renderZoom() {
  applyZoom($("#relicImg"), state.zoom);
  const lb = document.querySelector(".light-photo img"); if (lb) applyZoom(lb, state.zoom);
  $("#zoomPips").innerHTML = [5, 4, 3, 2, 1].map(l => `<i class="${state.zoom >= l ? "" : "off"}"></i>`).join("");
}
function zoomOut() { if (state.zoom > 0) { state.zoom--; renderZoom(); } }

/* ================= Map ================= */
const map = { svg: null, g: null, proj: null, path: null, zoom: null, countries: [], byName: new Map(), k: 1 };
async function initMap() {
  const topo = await fetch("countries-110m.json").then(r => r.json());
  const fc = topojson.feature(topo, topo.objects.countries);
  map.countries = fc.features.filter(f => !EXCLUDE.has(f.properties.name)).map((f, i) => {
    const name = DISPLAY[f.properties.name] || f.properties.name;
    let c;
    if (f.geometry.type === "MultiPolygon") {
      let best = null, ba = -1;
      for (const poly of f.geometry.coordinates) { const g = { type: "Polygon", coordinates: poly }, a = d3.geoArea(g); if (a > ba) { ba = a; best = g; } }
      c = d3.geoCentroid(best);
    } else c = d3.geoCentroid(f);
    const o = { f, name, centroid: c, tint: ["var(--land)", "var(--land-2)", "var(--land-3)"][i % 3] };
    map.byName.set(name.toLowerCase(), o);
    return o;
  });
  map.svg = d3.select("#map");
  map.g = map.svg.append("g");
  map.g.append("path").attr("class", "sphere");
  map.g.append("path").attr("class", "graticule");
  map.g.append("g").attr("class", "countries")
    .selectAll("path").data(map.countries).join("path")
    .attr("class", "country").attr("data-name", d => d.name)
    .attr("fill", d => d.tint)
    .on("click", (ev, d) => onCountryClick(d));
  map.g.append("g").attr("class", "overlays");
  map.g.append("g").attr("class", "labels");
  map.g.append("g").attr("class", "pinlayer");
  map.zoom = d3.zoom().scaleExtent([1, 10]).on("zoom", ev => {
    map.k = ev.transform.k; map.g.attr("transform", ev.transform); scaleMarks();
  });
  map.svg.call(map.zoom).on("dblclick.zoom", null);
  layoutMap();
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(layoutMap, 150); });
}
function mapExtent() {
  const W = innerWidth, H = innerHeight, con = $("#console").getBoundingClientRect();
  if (W >= 900) return [[24, 70], [Math.max(200, con.left - 16), H - 20]];
  return [[8, 60], [W - 8, Math.max(160, con.top - 8)]];
}
function layoutMap() {
  if (!map.svg) return;
  map.proj = d3.geoNaturalEarth1().fitExtent(mapExtent(), { type: "Sphere" });
  map.path = d3.geoPath(map.proj);
  map.g.select(".sphere").attr("d", map.path({ type: "Sphere" }));
  map.g.select(".graticule").attr("d", map.path(d3.geoGraticule10()));
  map.g.selectAll(".country").attr("d", d => map.path(d.f));
  redrawOverlays();
}
function redrawOverlays() {
  const ov = map.g.select(".overlays"); ov.selectAll("*").remove();
  if (state.used.ring) ov.append("path").attr("class", "ring").attr("d", map.path(d3.geoCircle().center(PUZZLE.ringCenter).radius(1000 / R_KM * 180 / Math.PI)()));
  const lab = map.g.select(".labels"); lab.selectAll("*").remove();
  state.where.guesses.forEach(g => {
    const o = map.byName.get(g.name.toLowerCase()); if (!o) return;
    const [x, y] = map.proj(o.centroid);
    lab.append("text").attr("class", "glabel").attr("x", x).attr("y", y).attr("text-anchor", "middle").text(g.correct ? g.name : `${g.name} ${g.pct}%`);
  });
  paintCountries();
  if (state.where.solved) placePin(false);
  scaleMarks();
}
function paintCountries() {
  const guessed = new Map(state.where.guesses.map(g => [g.name, g]));
  map.g.selectAll(".country")
    .attr("fill", d => { const g = guessed.get(d.name); return g ? (g.correct ? "var(--sage)" : heat(g.pct)) : d.tint; })
    .classed("guessed", d => guessed.has(d.name))
    .classed("dim", d => !!state.used.continent && !ASIA.has(d.name) && !guessed.has(d.name))
    .classed("sel", d => d.name === selectedCountry);
}
function scaleMarks() {
  if (!map.g) return;
  map.g.selectAll(".glabel").attr("font-size", 12 / map.k).style("stroke-width", 3 / map.k + "px");
  map.g.selectAll(".pin").attr("transform", function () { const [x, y] = map.proj(PUZZLE.target); return `translate(${x},${y}) scale(${1 / map.k})`; });
}
function placePin(animate) {
  const layer = map.g.select(".pinlayer"); layer.selectAll("*").remove();
  const [x, y] = map.proj(PUZZLE.target);
  const pin = layer.append("g").attr("class", "pin").attr("transform", `translate(${x},${y}) scale(${1 / map.k})`);
  const inner = pin.append("g");
  inner.append("ellipse").attr("rx", 6).attr("ry", 2.4).attr("fill", "rgba(58,57,70,.25)");
  const head = inner.append("g");
  head.append("path").attr("class", "pin-body").attr("d", "M0,0 C-3,-8 -11,-13 -11,-22 A11,11 0 1 1 11,-22 C11,-13 3,-8 0,0Z");
  head.append("circle").attr("class", "pin-dot").attr("cy", -22).attr("r", 4.2);
  if (!animate || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  head.attr("transform", "translate(0,-180)").style("opacity", 0)
    .transition().duration(650).ease(d3.easeBounceOut).attr("transform", "translate(0,0)").style("opacity", 1);
  [0, 280, 560].forEach(delay => {
    pin.insert("circle", ":first-child").attr("class", "ripple").attr("r", 2).style("opacity", .9)
      .transition().delay(600 + delay).duration(1500).ease(d3.easeCubicOut).attr("r", 70).style("opacity", 0).remove();
  });
}
function flyTo(lonlat, k) {
  const [x, y] = map.proj(lonlat), [[x0, y0], [x1, y1]] = mapExtent();
  const t = d3.zoomIdentity.translate((x0 + x1) / 2, (y0 + y1) / 2).scale(k).translate(-x, -y);
  map.svg.transition().duration(1100).ease(d3.easeCubicInOut).call(map.zoom.transform, t);
}

/* ================= Stepper ================= */
function renderStepper(ripple) {
  const w = state.where, wh = state.when, wt = state.what;
  const chips = [
    { k: "where", t: "Where", s: w.solved ? PUZZLE.country : `${w.guesses.length} guess${w.guesses.length === 1 ? "" : "es"}` },
    { k: "when", t: "When", s: wh.solved ? `${PUZZLE.yearLo}–${String(PUZZLE.yearHi).slice(2)}` : (state.phase === "where" ? "Locked" : `${wh.guesses.length} guess${wh.guesses.length === 1 ? "" : "es"}`) },
    { k: "what", t: "What", s: wt.solved ? PUZZLE.fn : (["where", "when"].includes(state.phase) ? "Locked" : (wt.step === "fn" ? "Function" : "Identity")) }
  ];
  $("#stepper").innerHTML = chips.map(c => {
    const solved = state[c.k].solved, active = state.phase === c.k;
    return `<div class="chip ${solved ? "solved" : ""} ${solved && state.bankrupt ? "helped" : ""} ${active ? "active" : ""}" data-k="${c.k}"><b>${c.t}</b><span>${esc(c.s)}</span>${ripple === c.k ? '<i class="rip"></i>' : ""}</div>`;
  }).join("");
}

/* ================= Hints + notes ================= */
function hintPrice(h) { return state.bankrupt ? 0 : (state.free[state.phase] ? 0 : h.price); }
function renderHints() {
  const box = $("#hintBox");
  if (state.phase === "done") { box.innerHTML = ""; return; }
  const list = HINTS[state.phase];
  const free = state.free[state.phase] && !state.bankrupt;
  box.innerHTML = `<div class="section-label"><span>Hints</span>${free ? '<span class="free-badge">1 free hint</span>' : ""}</div>
    <div class="hints" style="margin-top:8px">${list.map(h => {
      const done = !h.repeat && state.used[h.id];
      const blocked = (h.id === "zoom" && state.zoom === 0) || (h.needsStep && state.what.step !== h.needsStep);
      const p = hintPrice(h);
      return `<button class="hint" data-h="${h.id}" ${done || blocked ? "disabled" : ""}><span>${h.label}</span><span class="p ${p === 0 ? "free" : ""}">${done ? "used" : p === 0 ? "free" : "−" + p}</span></button>`;
    }).join("")}</div>`;
  box.querySelectorAll(".hint").forEach(b => b.addEventListener("click", () => useHint(b.dataset.h)));
}
function renderNotes() {
  const n = $("#notes");
  const banner = state.bankrupt && state.phase !== "done" ? `<div class="broke-banner">You're out of Insight. Guesses and hints are free now, but today's score is 0.</div>` : "";
  n.innerHTML = banner + (state.notes.length ? `<div class="section-label">Field notes</div>` : "") +
    state.notes.map(k => `<div class="note"><b>${NOTE_LABEL[k]}</b>${esc(PUZZLE.hintText[k])}</div>`).join("");
}
function useHint(id) {
  const h = HINTS[state.phase].find(x => x.id === id); if (!h) return;
  const p = hintPrice(h);
  if (state.free[state.phase] && !state.bankrupt) state.free[state.phase] = false;
  spend(p); state.hintsUsed++;
  if (id === "zoom") { zoomOut(); }
  else {
    state.used[id] = true;
    if (PUZZLE.hintText[id] && id !== "halve") state.notes.push(id);
    if (id === "continent") { paintCountries(); toast("Showing Asia"); }
    if (id === "ring") { redrawOverlays(); flyTo(PUZZLE.ringCenter, 2.6); }
    if (id === "halve") {
      const mid = Math.round((state.when.lo + state.when.hi) / 2);
      if (PUZZLE.yearLo > mid) state.when.lo = mid; else state.when.hi = mid;
      state.when.cur = Math.round((state.when.lo + state.when.hi) / 2);
      state.notes.push("halve"); tlRefresh(true);
    }
    if (id === "elim") { state.what.elim = true; renderWhatBody(); }
  }
  renderHints(); renderNotes(); save();
}

/* ================= Phase: WHERE ================= */
let selectedCountry = null, suggestIdx = 0, suggestions = [];
function onCountryClick(d) {
  if (state.phase !== "where") return;
  if (state.where.guesses.some(g => g.name === d.name)) { toast(`You already guessed ${d.name}`); return; }
  selectedCountry = d.name;
  const inp = $("#whereInput"); if (inp) { inp.value = d.name; }
  closeSuggest(); paintCountries(); updateWhereBtn();
}
function resolveCountry(text) {
  const t = text.trim().toLowerCase(); if (!t) return null;
  const alias = ALIASES[t]; if (alias) return alias;
  const o = map.byName.get(t); return o ? o.name : null;
}
function renderWhere() {
  $("#phaseBody").innerHTML = `<div class="phase-enter" style="display:flex;flex-direction:column;gap:14px">
    <div class="phase-head"><h2>Where was it made?</h2><p>Type a country or tap one on the map. Each guess costs <b>${COST.where}</b> Insight, and each miss pulls the photo back one step.</p></div>
    <div class="field">
      <input id="whereInput" type="text" placeholder="Search countries" autocomplete="off" spellcheck="false" aria-label="Country guess">
      <button class="btn btn-primary" id="whereBtn" disabled>Guess<span class="cost">−${COST.where}</span></button>
      <ul class="suggest" id="suggest" hidden></ul>
    </div>
    <ul class="glist" id="glist"></ul></div>`;
  const inp = $("#whereInput");
  inp.addEventListener("input", () => { selectedCountry = resolveCountry(inp.value); paintCountries(); openSuggest(inp.value); updateWhereBtn(); });
  inp.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); suggestIdx = Math.min(suggestions.length - 1, suggestIdx + 1); drawSuggest(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); suggestIdx = Math.max(0, suggestIdx - 1); drawSuggest(); }
    else if (e.key === "Escape") closeSuggest();
    else if (e.key === "Enter") {
      e.preventDefault();
      if (!$("#suggest").hidden && suggestions[suggestIdx]) pickSuggest(suggestions[suggestIdx]);
      else commitWhere();
    }
  });
  inp.addEventListener("blur", () => setTimeout(closeSuggest, 150));
  $("#whereBtn").addEventListener("click", commitWhere);
  drawGuessList();
  if (matchMedia("(min-width: 900px)").matches) inp.focus();
}
function openSuggest(q) {
  q = q.trim().toLowerCase();
  if (!q) { closeSuggest(); return; }
  const taken = new Set(state.where.guesses.map(g => g.name));
  const names = map.countries.map(c => c.name).filter(n => !taken.has(n));
  const aliasHit = ALIASES[q] && !taken.has(ALIASES[q]) ? [ALIASES[q]] : [];
  const starts = names.filter(n => n.toLowerCase().startsWith(q)).sort();
  const incl = names.filter(n => !n.toLowerCase().startsWith(q) && n.toLowerCase().includes(q)).sort();
  suggestions = [...new Set([...aliasHit, ...starts, ...incl])].slice(0, 6);
  suggestIdx = 0; drawSuggest();
}
function drawSuggest() {
  const ul = $("#suggest"); if (!ul) return;
  if (!suggestions.length) { ul.hidden = true; return; }
  ul.hidden = false;
  ul.innerHTML = suggestions.map((n, i) => `<li class="${i === suggestIdx ? "hi" : ""}" data-n="${esc(n)}">${esc(n)}</li>`).join("");
  ul.querySelectorAll("li").forEach(li => li.addEventListener("mousedown", e => { e.preventDefault(); pickSuggest(li.dataset.n); }));
}
function closeSuggest() { const ul = $("#suggest"); if (ul) ul.hidden = true; suggestions = []; }
function pickSuggest(n) { $("#whereInput").value = n; selectedCountry = n; closeSuggest(); paintCountries(); updateWhereBtn(); }
function updateWhereBtn() {
  const b = $("#whereBtn"); if (!b) return;
  const ok = selectedCountry && !state.where.guesses.some(g => g.name === selectedCountry);
  b.disabled = !ok;
  b.innerHTML = `Guess${state.bankrupt ? "" : `<span class="cost">−${COST.where}</span>`}`;
}
function commitWhere() {
  const inp = $("#whereInput");
  const name = selectedCountry || resolveCountry(inp.value);
  if (!name) { shake(inp); toast("Pick a country from the list"); return; }
  if (state.where.guesses.some(g => g.name === name)) { shake(inp); toast(`You already guessed ${name}`); return; }
  const o = map.byName.get(name.toLowerCase());
  spend(COST.where);
  const correct = name === PUZZLE.country;
  const km = correct ? 0 : d3.geoDistance(o.centroid, PUZZLE.target) * R_KM;
  const pct = correct ? 100 : Math.max(0, Math.round((1 - km / (Math.PI * R_KM)) * 100));
  const g = { name, km, pct, dir: correct ? 0 : bearing(o.centroid, PUZZLE.target), correct };
  state.where.guesses.push(g);
  selectedCountry = null; inp.value = ""; closeSuggest();
  redrawOverlays(); drawGuessList(); updateWhereBtn();
  if (correct) {
    state.where.solved = true;
    placePin(true); flyTo(PUZZLE.target, 3.2);
    finishPhase("where", "when", state.where.guesses.length);
  } else {
    zoomOut();
    toast(`${name}: ${fmtKm(km)} away`);
    renderStepper(); save();
  }
}
function drawGuessList() {
  const ul = $("#glist"); if (!ul) return;
  ul.innerHTML = [...state.where.guesses].reverse().map(g => `<li class="grow ${g.correct ? "win" : ""}">
    <span class="nm">${esc(g.name)}</span>
    <span class="km">${g.correct ? "found it" : fmtKm(g.km)}</span>
    <span class="arrow" style="transform:rotate(${g.dir}deg)" aria-label="direction">${g.correct ? "📍" : "↑"}</span>
    <span class="pct" style="background:${g.correct ? "var(--sage)" : heat(g.pct)}">${g.pct}%</span></li>`).join("");
}

/* ================= Momentum ================= */
function finishPhase(from, to, n) {
  state.momentum[from] = n;
  let msg = "";
  if (to && to !== "done" && !state.bankrupt) {
    if (n === 1) { gain(5); state.free[to] = true; msg = "First try! +5 Insight and a free hint in the next phase"; }
    else if (n === 2) { state.free[to] = true; msg = "Momentum: your next phase starts with a free hint"; }
  }
  renderStepper(from); renderHints(); save();
  if (msg) toast(msg, 3000);
  setTimeout(() => {
    state.phase = to; save();
    renderPhase();
    if (to === "done") setTimeout(showReveal, 500);
  }, 1100);
}

/* ================= Phase: WHEN (timeline) ================= */
const TL_MIN = -3000, TL_MAX = 2025;
const tl = { vLo: TL_MIN, vHi: TL_MAX, anim: null };
function snapStep() { const span = state.when.hi - state.when.lo; return span > 3000 ? 25 : span > 1000 ? 10 : span > 300 ? 5 : 1; }
function viewTarget() {
  const { lo, hi } = state.when, pad = Math.max(12, (hi - lo) * .08);
  return [Math.max(TL_MIN - 50, lo - pad), Math.min(TL_MAX + 50, hi + pad)];
}
function renderWhen() {
  $("#phaseBody").innerHTML = `<div class="phase-enter" style="display:flex;flex-direction:column;gap:14px">
    <div class="phase-head"><h2>When was it made?</h2><p>Drag the marker to a year. A guess within <b>±${PUZZLE.tolerance} years</b> of the true date solves it. Each guess costs <b>${COST.when}</b>, and the yellow window shrinks as you learn.</p></div>
    <div class="yearbox">
      <span class="yearval" id="yearVal"></span>
      <span class="era" role="group" aria-label="Era"><button id="eraBce">BCE</button><button id="eraCe">CE</button></span>
    </div>
    <div class="tl" id="tl" aria-label="Timeline">
      <div class="tl-base"></div><div class="tl-win" id="tlWin"></div>
      <div class="tl-ticks" id="tlTicks"></div><div id="tlMarks"></div>
      <div class="tl-handle" id="tlHandle" tabindex="0" role="slider" aria-label="Year" aria-valuemin="${TL_MIN}" aria-valuemax="${TL_MAX}"></div>
    </div>
    <div class="nudges">${[-100, -10, -1, 1, 10, 100].map(n => `<button data-n="${n}">${n > 0 ? "+" : "−"}${Math.abs(n)}</button>`).join("")}</div>
    <button class="btn btn-primary" id="whenBtn">Guess this year<span class="cost">−${COST.when}</span></button>
    <ul class="glist" id="wlist"></ul></div>`;
  [tl.vLo, tl.vHi] = viewTarget();
  const el = $("#tl");
  const setFromX = clientX => {
    const r = el.getBoundingClientRect(), f = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
    setYear(tl.vLo + f * (tl.vHi - tl.vLo), true);
  };
  el.addEventListener("pointerdown", e => { el.setPointerCapture(e.pointerId); setFromX(e.clientX); $("#tlHandle").focus({ preventScroll: true }); });
  el.addEventListener("pointermove", e => { if (el.hasPointerCapture(e.pointerId)) setFromX(e.clientX); });
  $("#tlHandle").addEventListener("keydown", e => {
    const s = snapStep() * (e.shiftKey ? 10 : 1);
    if (e.key === "ArrowRight" || e.key === "ArrowUp") { e.preventDefault(); setYear(state.when.cur + s); }
    if (e.key === "ArrowLeft" || e.key === "ArrowDown") { e.preventDefault(); setYear(state.when.cur - s); }
    if (e.key === "Enter") commitWhen();
  });
  document.querySelectorAll(".nudges button").forEach(b => b.addEventListener("click", () => setYear(state.when.cur + +b.dataset.n)));
  $("#eraBce").addEventListener("click", () => { if (state.when.cur > 0) setYear(-state.when.cur); });
  $("#eraCe").addEventListener("click", () => { if (state.when.cur < 0) setYear(-state.when.cur); });
  $("#whenBtn").addEventListener("click", commitWhen);
  setYear(state.when.cur); tlDraw(); drawWhenList();
}
function setYear(v, snap) {
  const { lo, hi } = state.when;
  if (snap) { const s = snapStep(); v = Math.round(v / s) * s; }
  v = Math.round(Math.max(lo, Math.min(hi, v)));
  if (v === 0) v = state.when.cur < 0 ? 1 : -1;
  state.when.cur = v;
  const yv = $("#yearVal"); if (!yv) return;
  yv.textContent = Math.abs(v);
  $("#eraBce").classList.toggle("on", v < 0); $("#eraCe").classList.toggle("on", v > 0);
  $("#tlHandle").setAttribute("aria-valuenow", v); $("#tlHandle").setAttribute("aria-valuetext", fmtYear(v));
  const b = $("#whenBtn"); if (b) b.innerHTML = `Guess ${fmtYear(v)}${state.bankrupt ? "" : `<span class="cost">−${COST.when}</span>`}`;
  tlPlaceHandle();
}
const pctX = v => ((v - tl.vLo) / (tl.vHi - tl.vLo)) * 100;
function tlPlaceHandle() { const h = $("#tlHandle"); if (h) h.style.left = pctX(state.when.cur) + "%"; }
function tlDraw() {
  if (!$("#tl")) return;
  const { lo, hi } = state.when, span = tl.vHi - tl.vLo;
  const w = $("#tlWin"); w.style.left = pctX(lo) + "%"; w.style.width = (pctX(hi) - pctX(lo)) + "%";
  const steps = [1, 2, 5, 10, 25, 50, 100, 250, 500, 1000];
  const st = steps.find(s => span / s <= 5) || 1000;
  let ticks = ""; for (let t = Math.ceil(tl.vLo / st) * st; t <= tl.vHi; t += st) {
    const x = pctX(t); if (x < 4 || x > 96) continue;
    ticks += `<span style="left:${x}%">${t < 0 ? -t + " BCE" : t === 0 ? "1 CE" : t}</span>`;
  }
  $("#tlTicks").innerHTML = ticks;
  const bandBg = { close: "var(--butter)", warm: "var(--peach)", far: "var(--rose)", hit: "var(--sage)" };
  $("#tlMarks").innerHTML = state.when.guesses.map(g => {
    const x = pctX(g.y); if (x < -5 || x > 105) return "";
    return `<span class="tl-mark" style="left:${Math.max(3, Math.min(97, x))}%;background:${bandBg[g.band]}">${g.dir === "later" ? "→" : g.dir === "earlier" ? "←" : "✓"} ${g.y < 0 ? -g.y + "B" : g.y}</span>`;
  }).join("");
  tlPlaceHandle();
}
function tlRefresh(animate) {
  const [toLo, toHi] = viewTarget();
  if (!animate || matchMedia("(prefers-reduced-motion: reduce)").matches) { tl.vLo = toLo; tl.vHi = toHi; tlDraw(); setYear(state.when.cur); return; }
  const fLo = tl.vLo, fHi = tl.vHi, t0 = performance.now();
  cancelAnimationFrame(tl.anim);
  const step = now => {
    const k = Math.min(1, (now - t0) / 700), e = 1 - Math.pow(1 - k, 3);
    tl.vLo = fLo + (toLo - fLo) * e; tl.vHi = fHi + (toHi - fHi) * e; tlDraw();
    if (k < 1) tl.anim = requestAnimationFrame(step); else setYear(state.when.cur);
  };
  tl.anim = requestAnimationFrame(step);
}
function commitWhen() {
  const y = state.when.cur;
  if (state.when.guesses.some(g => g.y === y)) { shake($("#whenBtn")); toast("You already tried that year"); return; }
  spend(COST.when);
  const { yearLo, yearHi, tolerance: tol } = PUZZLE;
  const dist = y < yearLo ? yearLo - y : y > yearHi ? y - yearHi : 0;
  const hit = dist <= tol;
  const band = hit ? "hit" : dist <= 3 * tol ? "close" : dist <= 10 * tol ? "warm" : "far";
  const dir = hit ? "hit" : y < yearLo ? "later" : "earlier";
  state.when.guesses.push({ y, band, dir });
  if (!hit) {
    if (dir === "later") state.when.lo = Math.max(state.when.lo, y + 1); else state.when.hi = Math.min(state.when.hi, y - 1);
    state.when.cur = Math.round((state.when.lo + state.when.hi) / 2);
    zoomOut();
    toast(`${fmtYear(y)}: ${dir === "later" ? "it's later" : "it's earlier"}${band === "close" ? ", and you're close" : ""}`);
    tlRefresh(true); drawWhenList(); renderStepper(); save();
  } else {
    state.when.solved = true; tlDraw(); drawWhenList();
    finishPhase("when", "what", state.when.guesses.length);
  }
}
function drawWhenList() {
  const ul = $("#wlist"); if (!ul) return;
  const lbl = { hit: "within range", close: "close", warm: "warm", far: "far" };
  const bg = { close: "var(--butter)", warm: "var(--peach)", far: "var(--rose)", hit: "var(--sage)" };
  ul.innerHTML = [...state.when.guesses].reverse().map(g => `<li class="grow ${g.band === "hit" ? "win" : ""}" style="grid-template-columns:1fr auto 80px">
    <span class="nm">${fmtYear(g.y)}</span>
    <span class="km">${g.dir === "later" ? "later →" : g.dir === "earlier" ? "← earlier" : "✓"}</span>
    <span class="pct" style="background:${bg[g.band]}">${lbl[g.band]}</span></li>`).join("");
}

/* ================= Phase: WHAT ================= */
let whatSel = null;
function renderWhat() {
  $("#phaseBody").innerHTML = `<div class="phase-enter" style="display:flex;flex-direction:column;gap:14px" id="whatWrap"></div>`;
  renderWhatBody();
}
function idCost() { return state.what.fnWrong.length === 0 ? COST.idDiscount : COST.id; }
function renderWhatBody() {
  const w = state.what, wrap = $("#whatWrap"); if (!wrap) return;
  whatSel = null;
  if (w.step === "fn") {
    wrap.innerHTML = `<div class="phase-head"><h2>What was it for?</h2><p>First, its function. Each guess costs <b>${COST.fn}</b>. Getting it right first try discounts the final question.</p></div>
      <div class="cats">${CATEGORIES.map(c => `<button class="cat ${w.fnWrong.includes(c) ? "wrong" : ""}" data-c="${esc(c)}" ${w.fnWrong.includes(c) ? "disabled" : ""}>${esc(c)}</button>`).join("")}</div>
      <button class="btn btn-primary" id="whatBtn" disabled>Choose a function<span class="cost">−${COST.fn}</span></button>`;
    wrap.querySelectorAll(".cat").forEach(b => b.addEventListener("click", () => {
      wrap.querySelectorAll(".cat").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); whatSel = b.dataset.c;
      $("#whatBtn").disabled = false; $("#whatBtn").innerHTML = `Guess “${esc(whatSel)}”${state.bankrupt ? "" : `<span class="cost">−${COST.fn}</span>`}`;
    }));
  } else {
    const c = idCost();
    wrap.innerHTML = `<div class="phase-head"><h2>Which object is it?</h2><p>It's a <b>${esc(PUZZLE.fn.toLowerCase())}</b>. Now pick the right description. Each guess costs <b>${c}</b>${c < COST.id ? " (first-try discount)" : ""}.</p></div>
      <div class="opts">${PUZZLE.options.map((o, i) => {
        const gone = w.elim && PUZZLE.eliminate.includes(i), wrong = w.idWrong.includes(i), right = w.solved && i === PUZZLE.answer;
        return `<button class="opt ${gone ? "gone" : ""} ${wrong ? "wrong" : ""} ${right ? "right" : ""}" data-i="${i}" ${gone || wrong || w.solved ? "disabled" : ""}>${esc(o)}</button>`;
      }).join("")}</div>
      <button class="btn btn-primary" id="whatBtn" disabled>Choose a description<span class="cost">−${c}</span></button>`;
    wrap.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      wrap.querySelectorAll(".opt").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); whatSel = +b.dataset.i;
      $("#whatBtn").disabled = false; $("#whatBtn").innerHTML = `Lock it in${state.bankrupt ? "" : `<span class="cost">−${c}</span>`}`;
    }));
  }
  $("#whatBtn").addEventListener("click", commitWhat);
}
function commitWhat() {
  const w = state.what; if (whatSel === null) return;
  if (w.step === "fn") {
    spend(COST.fn);
    if (whatSel === PUZZLE.fn) {
      w.fnSolved = true; w.step = "id";
      toast(w.fnWrong.length === 0 ? `Yes, a ${PUZZLE.fn.toLowerCase()}. The next guess is discounted.` : `Yes, a ${PUZZLE.fn.toLowerCase()}`);
      renderStepper("what"); renderWhatBody(); renderHints();
    } else {
      w.fnWrong.push(whatSel); zoomOut(); toast(`Not a ${whatSel.toLowerCase()}`); renderWhatBody();
    }
  } else {
    spend(idCost());
    if (whatSel === PUZZLE.answer) {
      w.solved = true; renderWhatBody();
      finishPhase("what", "done", w.fnWrong.length + w.idWrong.length + 2);
      return;
    }
    w.idWrong.push(whatSel); zoomOut(); toast("Not that one"); renderWhatBody();
  }
  renderStepper(); save();
}

/* ================= Done / reveal ================= */
function score() {
  if (state.bankrupt) return { total: 0, parts: [] };
  const parts = [["Insight left", state.insight], [`Zoom bonus (${state.zoom} unrevealed × 3)`, state.zoom * 3], ["Find-spot bonus", 5]];
  return { total: parts.reduce((a, p) => a + p[1], 0), parts };
}
function rank(t) {
  if (state.bankrupt) return ["🧭", "Excavated with help"];
  return t >= 90 ? ["🏛️", "Curator"] : t >= 70 ? ["⛏️", "Archaeologist"] : t >= 50 ? ["📜", "Scholar"] : t >= 25 ? ["🎒", "Tourist"] : ["🕯️", "Lost in the Archives"];
}
function shareText() {
  const s = score(), [emo] = rank(s.total);
  const where = state.where.guesses.map(g => g.correct ? "✅" : heatEmoji(g.pct)).join("");
  const when = state.when.guesses.map(g => g.band === "hit" ? "✅" : g.dir === "later" ? (g.band === "close" ? "🟨" : "⬆️") : (g.band === "close" ? "🟨" : "⬇️")).join("");
  const what = state.what.fnWrong.map(() => "❌").join("") + "✅" + state.what.idWrong.map(() => "❌").join("") + "✅";
  return `Relic #${PUZZLE.no} · ${PUZZLE.day} ${emo} ${s.total}\n🌍 ${where}\n📅 ${when}\n❓ ${what}\n🔍 Zoom ${state.zoom}/5 · 💡 ${state.hintsUsed} hint${state.hintsUsed === 1 ? "" : "s"}`;
}
function renderDone() {
  const s = score(), [emo, name] = rank(s.total);
  $("#phaseBody").innerHTML = `<div class="phase-enter" style="display:flex;flex-direction:column;gap:12px">
    <div class="phase-head"><h2>Relic recovered</h2><p>${emo} ${esc(name)}, with a score of <b>${s.total}</b>.</p></div>
    <button class="btn btn-primary" id="openReveal">See the full relic</button></div>`;
  $("#openReveal").addEventListener("click", showReveal);
}
function showReveal() {
  const s = score(), [emo, name] = rank(s.total), r = PUZZLE.reveal;
  modal(`<div class="sheet" role="dialog" aria-modal="true" aria-label="Today's relic">
    <div class="reveal-top"><img src="${PUZZLE.image}" alt="${esc(r.title)}, full view">
      <div><div class="eyebrow">Relic #${PUZZLE.no} · ${PUZZLE.day} ${PUZZLE.date}</div>
      <h2>${esc(r.title)}</h2>
      <div class="score-big">${s.total}</div><div class="rank">${emo} ${esc(name)}</div></div></div>
    ${r.story.map(p => `<p>${esc(p)}</p>`).join("")}
    <table>${r.facts.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table>
    ${s.parts.length ? `<div class="eyebrow">Score</div><table>${s.parts.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n">${v}</td></tr>`).join("")}<tr><td><b>Total</b></td><td class="n"><b>${s.total}</b></td></tr></table>` : ""}
    <pre class="share-pre" id="sharePre">${esc(shareText())}</pre>
    <div class="row-btns"><button class="btn btn-primary" id="copyBtn">Copy result</button><button class="btn btn-ghost" id="replayBtn">Play again (practice)</button>
    <a href="${r.url}" target="_blank" rel="noopener">View at The Met ↗</a></div></div>`);
  $("#copyBtn").addEventListener("click", () => {
    const txt = shareText();
    navigator.clipboard.writeText(txt).then(() => toast("Copied. Paste it anywhere."), () => {
      const sel = getSelection(), rg = document.createRange(); rg.selectNodeContents($("#sharePre")); sel.removeAllRanges(); sel.addRange(rg);
      toast("Text selected. Press Copy to share it.");
    });
  });
  $("#replayBtn").addEventListener("click", resetGame);
}
function modal(html, onClose) {
  const root = $("#modalRoot");
  root.innerHTML = `<div class="scrim">${html}</div>`;
  const scrim = root.firstElementChild;
  const close = () => { root.innerHTML = ""; document.removeEventListener("keydown", esc_); onClose && onClose(); };
  const esc_ = e => { if (e.key === "Escape") close(); };
  scrim.addEventListener("click", e => { if (e.target === scrim) close(); });
  document.addEventListener("keydown", esc_);
  return close;
}
function showHelp() {
  const rows = [["Where guess", COST.where], ["When guess", COST.when], ["What: function guess", COST.fn], ["What: identity guess", `${COST.id} (${COST.idDiscount} if function right first try)`]];
  const close = modal(`<div class="sheet" role="dialog" aria-modal="true" aria-label="How to play">
    <div class="eyebrow">How to play</div><h2>Find where, when and what</h2>
    <p>Each day brings one real object from The Met's open-access collection, shown as a tight close-up. Work out <b>where</b> it was made, <b>when</b>, and <b>what</b> it is.</p>
    <p>You start with <b>100 Insight</b>. Guesses and hints spend it. Every miss pulls the photo back one step, so mistakes reveal more of the object but cost points. Whatever Insight is left becomes your score.</p>
    <table class="price-table">${rows.map(([k, v]) => `<tr><td>${k}</td><td class="n">${v}</td></tr>`).join("")}</table>
    <p><b>Momentum.</b> Solve a phase on your first guess for +5 Insight and a free hint in the next phase. Solve it on your second guess for just the free hint.</p>
    <p><b>Bonuses.</b> +3 for every zoom level you never revealed, and +5 for finding the find-spot. If you run out of Insight you can keep playing for free, but the score drops to 0.</p>
    <div class="row-btns"><button class="btn btn-primary" id="startBtn">${state.where.guesses.length ? "Back to the dig" : "Start digging"}</button></div></div>`,
    () => { if (!state.seenHelp) { state.seenHelp = true; save(); } });
  $("#startBtn").addEventListener("click", close);
}
function showLightbox() {
  modal(`<div class="light-photo"><img src="${PUZZLE.image}" alt="Enlarged close-up of today's relic" draggable="false"></div>`);
  const img = document.querySelector(".light-photo img");
  img.style.transition = "none";
  if (state.phase === "done") img.style.transform = "none"; else applyZoom(img, state.zoom);
  $(".light-photo").addEventListener("click", () => { $("#modalRoot").innerHTML = ""; });
}
function resetGame() {
  const seen = state.seenHelp;
  state = freshState(); state.seenHelp = seen; save();
  $("#modalRoot").innerHTML = "";
  shownInsight = 100; tweenInsight();
  selectedCountry = null;
  map.g.select(".pinlayer").selectAll("*").remove();
  map.svg.transition().duration(800).call(map.zoom.transform, d3.zoomIdentity);
  redrawOverlays(); renderPhase(); renderZoom();
}

/* ================= Phase router ================= */
function renderPhase() {
  renderStepper();
  if (state.phase === "where") renderWhere();
  else if (state.phase === "when") renderWhen();
  else if (state.phase === "what") renderWhat();
  else renderDone();
  if (state.phase === "done") { renderZoomFull(); }
  renderHints(); renderNotes();
  $("#consoleScroll").scrollTop = 0;
}
function renderZoomFull() {
  const img = $("#relicImg"); img.style.transform = "scale(1) translate(0,0)";
  $("#zoomPips").innerHTML = [5, 4, 3, 2, 1].map(() => `<i class="off"></i>`).join("");
}

/* ================= Boot ================= */
async function start(data) {
  state = (data && data.state) || load() || freshState();
  shownInsight = state.insight;
  $("#issue").textContent = `No. ${PUZZLE.no} · ${PUZZLE.day} ${PUZZLE.date}`;
  $("#insightNum").textContent = state.insight; tweenInsight();
  renderZoom();
  $("#helpBtn").addEventListener("click", showHelp);
  $("#polaroid").addEventListener("click", showLightbox);
  try { await initMap(); } catch (e) { toast("The map couldn't load. Refresh to try again.", 5000); }
  renderPhase();
  if (state.where.solved && map.proj) flyTo(PUZZLE.target, 3.2);
  if (state.phase === "done") renderZoomFull();
  if (!state.seenHelp) showHelp();
}
if (window.claude?.hot?.snapshot) window.claude.hot.snapshot(() => ({ state }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
